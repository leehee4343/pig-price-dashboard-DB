services:
  - type: web
    name: pig-dashboard-upload-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: UPLOAD_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        value: leehee4343
      - key: GITHUB_REPO
        value: pig-price-dashboard
