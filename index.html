// ================= P9 기존 보고용 통계 (레거시 리포트) =================
// '기존 보고용 통계.html'(원본 보고서 와이어프레임)의 화면을 대시보드 안에 한 페이지로 이식한 것.
// 원본은 하드코딩된 고정 수치였으나, 도매시장(경매) 비교를 제외한 항목은 원천 엑셀로 실데이터 산출이
// 가능해 섹션 단위로 하나씩 실데이터로 교체 중이다(도매시장 관련 섹션·비교값은 이번 범위에서 제외).
// 상단 조회 필터(지역/업체/기간)는 activatePage()에서 이 페이지일 때만 숨긴다 — p9는 필터와 무관하게
// 항상 현재 로드된 엑셀 전체(등록된 날짜 범위 전부)를 대상으로 집계한다.
function downloadTableToExcel(tableId, filename) {
  if (typeof XLSX === 'undefined') { alert('\uc5d1\uc140 \ub2e4\uc6b4\ub85c\ub4dc \uae30\ub2a5\uc744 \uc0ac\uc6a9\ud560 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4 (xlsx \ub77c\uc774\ube0c\ub7ec\ub9ac \ub85c\ub4dc \uc2e4\ud328).'); return; }
  const table = document.getElementById(tableId);
  if (!table) return;

  const aoa = [...table.querySelectorAll('tr')].map(row =>
    [...row.querySelectorAll('td, th')].map(cell =>
      cell.innerText.replace(/(\r\n|\n|\r)/gm, '').replace(/(\s\s+)/gm, ' ')
    )
  );
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, (filename || tableId).slice(0, 31));
  XLSX.writeFile(wb, `${filename || tableId}.xlsx`);
}

function lrBuildTable(elId, headers, rows){
  const el = document.getElementById(elId);
  if (!el) return;
  let h = '<thead><tr>' + headers.map(x=>`<th>${x}</th>`).join('') + '</tr></thead><tbody>';
  rows.forEach(r=>{ h += '<tr>' + r.map((c,i)=>`<td${i===0?' class="strong"':''}>${c}</td>`).join('') + '</tr>'; });
  h += '</tbody>';
  el.innerHTML = h;

  let parent = el.parentElement;
  if (parent && parent.classList.contains('table-scroll')) {
    parent = parent.parentElement;
  }
  if (parent) {
    let existingBtn = parent.querySelector(`.btn-excel-download[data-target="${elId}"]`);
    if (!existingBtn) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-excel-download';
      btn.setAttribute('data-target', elId);
      btn.setAttribute('aria-label', '현재 표를 엑셀 파일로 다운로드');
      btn.innerHTML = excelDownloadButtonContent();
      btn.addEventListener('click', () => {
        const titleEl = parent.querySelector('.card-head-title, h3, .subtitle, .card-head h3');
        const filename = titleEl ? titleEl.innerText.replace('📊', '').replace('📈', '').replace('trend', '').replace('won','').trim() : elId;
        downloadTableToExcel(elId, filename);
      });
      
      const cardHead = parent.querySelector(':scope > h3, :scope > .card-head');
      if (cardHead) {
        cardHead.appendChild(btn);
      } else {
        const actionRow = document.createElement('div');
        actionRow.className = 'table-action-row';
        actionRow.appendChild(btn);
        parent.insertBefore(actionRow, parent.firstChild);
      }
    }
  }
}

// 업체 규모 구간 라벨. 원천 엑셀에는 '연간 처리능력' 같은 규모 정보가 없어
// 조사기간 내 실제 두수 합계를 기준으로 원본 보고서와 동일한 4개 구간 이름을 재사용한다.
// (원본은 '연간 처리능력 추정치' 기준, 이 페이지는 '등록된 기간 내 실측치' 기준 — 화면에 안내 문구로 명시)
const SIZE_BUCKET_ORDER = ['3만두미만','3~5만두미만','5~10만두미만','10만두이상'];
function bucketBySize(totalHead){
  if (totalHead < 30000) return '3만두미만';
  if (totalHead < 50000) return '3~5만두미만';
  if (totalHead < 100000) return '5~10만두미만';
  return '10만두이상';
}

// p9가 쓰는 원천 데이터 1회 파싱·집계. processDashboardData()의 지역/업체/등록일 필터와 달리
// p9는 조사월(년+월) 범위(monthRange = {start, end}, 각각 'YYYY-MM')로만 조회한다 — 지정하지 않으면 전체 기간을 대상으로 한다.
// 도매시장(경매) 관련 통계는 원천에 없어 산출하지 않는다.
function computeLegacyReportStats(monthRange){
  if (!excelPriceRows || !excelCompanyRows) return null;

  const compHeaders = excelCompanyRows[0] || [];
  const compNameIdx = compHeaders.indexOf('업체명');
  const compRegionIdx = compHeaders.indexOf('시도명');
  const compUseIdx = compHeaders.indexOf('사용여부');
  const companyRegionMap = {};
  for (let i = 1; i < excelCompanyRows.length; i++) {
    const row = excelCompanyRows[i];
    if (!row || row.length === 0) continue;
    const name = row[compNameIdx];
    const useYn = row[compUseIdx] || 'Y';
    if (name && useYn === 'Y' && !TEST_COMPANIES.includes(name)) {
      companyRegionMap[name] = row[compRegionIdx] || '';
    }
  }

  const parseNum = val => {
    if (val === null || val === undefined || val === '') return 0;
    if (typeof val === 'number') return val;
    return parseFloat(String(val).replace(/,/g, '')) || 0;
  };

  const rows = [];
  let minDate = null, maxDate = null;
  for (let i = 3; i < excelPriceRows.length; i++) {
    const r = excelPriceRows[i];
    if (!r || r.length < 2) continue;
    const company = r[0];
    const dateStr = r[1];
    if (!company || !dateStr || TEST_COMPANIES.includes(company)) continue;
    const rowYm = dateStr.substring(0, 7);
    if (monthRange && monthRange.start && (rowYm < monthRange.start || rowYm > monthRange.end)) continue;

    let regDate = dateStr;
    if (r[16]) {
      const m = String(r[16]).match(/^(\d{4}-\d{2}-\d{2})/);
      if (m) regDate = m[1];
    }
    if (!minDate || regDate < minDate) minDate = regDate;
    if (!maxDate || regDate > maxDate) maxDate = regDate;

    rows.push({
      company,
      date: dateStr,
      regDate,
      ym: dateStr.substring(0, 7),
      headCount: parseNum(r[2]),
      liveWeight: parseNum(r[3]),
      totalAmount: parseNum(r[4]),
      paymentRate: (r[5] !== null && r[5] !== undefined && r[5] !== '') ? parseFloat(r[5]) : null,
      carcassHead: parseNum(r[6]),
      carcassWeight: parseNum(r[7]),
      femaleHead: parseNum(r[8]),
      castratedHead: parseNum(r[10]),
      maleHead: parseNum(r[12]),
      priceType: (r[14] !== null && r[14] !== undefined && r[14] !== '') ? String(r[14]) : null,
      appliedUnitPrice: (r[15] !== null && r[15] !== undefined && r[15] !== '') ? parseFloat(String(r[15]).replace(/,/g, '')) : null,
      region: companyRegionMap[company] || '기타'
    });
  }

  if (rows.length === 0) return null;

  const companies = [...new Set(rows.map(r => r.company))];
  const companyHeadTotal = {};
  rows.forEach(r => { companyHeadTotal[r.company] = (companyHeadTotal[r.company] || 0) + r.headCount; });

  return { rows, companyRegionMap, companies, companyHeadTotal, period: { start: minDate, end: maxDate } };
}

// 조사일자('YYYY-MM') -> 'YY.M' 표기 (예: '2026-01' -> '26.1')
function lrYmLabel(ym){
  const [y, m] = ym.split('-');
  return `${y.slice(2)}.${parseInt(m, 10)}`;
}

// "Ⅰ 거래가격 조사 현황" 섹션 전용 집계. computeLegacyReportStats()의 원시 rows를
// 월별/업체규모별/권역별/적용단가유형별/성별로 재가공한다.
function computeSection1(stats){
  const rows = stats.rows;
  const totalHead = rows.reduce((s, r) => s + r.headCount, 0);
  const totalTransactions = rows.length;

  const monthlyMap = {};
  rows.forEach(r => {
    if (!monthlyMap[r.ym]) monthlyMap[r.ym] = { ym: r.ym, companies: new Set(), head: 0, live: 0, carcass: 0, amount: 0 };
    const g = monthlyMap[r.ym];
    g.companies.add(r.company); g.head += r.headCount; g.live += r.liveWeight; g.carcass += r.carcassWeight; g.amount += r.totalAmount;
  });
  const monthlyList = Object.keys(monthlyMap).sort().map(ym => {
    const g = monthlyMap[ym];
    return {
      ym,
      companyCount: g.companies.size,
      head: g.head,
      liveTon: g.live / 1000,
      carcassTon: g.carcass / 1000,
      amountMil: g.amount / 1000000,
      avgLive: g.head > 0 ? g.live / g.head : 0,
      avgCarcass: g.head > 0 ? g.carcass / g.head : 0,
      pricePerHead: g.head > 0 ? g.amount / g.head : 0
    };
  });

  // 업체 규모별 분포 (조사기간 내 실측 두수 합계 기준, 업체 수)
  const sizeCount = {}; SIZE_BUCKET_ORDER.forEach(b => sizeCount[b] = 0);
  stats.companies.forEach(c => { sizeCount[bucketBySize(stats.companyHeadTotal[c] || 0)]++; });

  // 권역별 분포 (업체 수 기준)
  const regionCount = {};
  stats.companies.forEach(c => {
    const rg = regionGroupOf(stats.companyRegionMap[c] || '');
    regionCount[rg] = (regionCount[rg] || 0) + 1;
  });
  const regionOrder = [...REGION_GROUP_ORDER, '기타'].filter(rg => regionCount[rg] > 0);

  // 적용단가 유형별 구성비 (두수 가중)
  const typeHead = {};
  let typeHeadTotal = 0;
  rows.forEach(r => {
    if (r.priceType) { typeHead[r.priceType] = (typeHead[r.priceType] || 0) + r.headCount; typeHeadTotal += r.headCount; }
  });
  const priceTypeDist = Object.entries(typeHead)
    .map(([type, head]) => ({ type, head, pct: typeHeadTotal > 0 ? head / typeHeadTotal * 100 : 0 }))
    .sort((a, b) => b.head - a.head);

  // 권역별 성별 출현율
  const regionGenderMap = {};
  rows.forEach(r => {
    const rg = regionGroupOf(r.region);
    if (!regionGenderMap[rg]) regionGenderMap[rg] = { female: 0, castrated: 0, male: 0 };
    regionGenderMap[rg].female += r.femaleHead;
    regionGenderMap[rg].castrated += r.castratedHead;
    regionGenderMap[rg].male += r.maleHead;
  });
  const genderRegionOrder = regionOrder.filter(rg => regionGenderMap[rg]);
  const genderTotal = { female: 0, castrated: 0, male: 0 };
  genderRegionOrder.forEach(rg => {
    const g = regionGenderMap[rg];
    genderTotal.female += g.female; genderTotal.castrated += g.castrated; genderTotal.male += g.male;
  });

  // 업체 규모별 지급률 (월 x 규모구간 교차표용 원시 집계)
  const rateMonthMap = {};
  rows.forEach(r => {
    if (!rateMonthMap[r.ym]) rateMonthMap[r.ym] = { companies: new Set(), bucket: {}, all: { sum: 0, count: 0 } };
    const g = rateMonthMap[r.ym];
    if (r.paymentRate !== null) {
      const bucket = bucketBySize(stats.companyHeadTotal[r.company] || 0);
      if (!g.bucket[bucket]) g.bucket[bucket] = { sum: 0, count: 0 };
      g.companies.add(r.company);
      g.bucket[bucket].sum += r.paymentRate; g.bucket[bucket].count++;
      g.all.sum += r.paymentRate; g.all.count++;
    }
  });

  return { totalHead, totalTransactions, monthlyList, sizeCount, regionCount, regionOrder, priceTypeDist, regionGenderMap, genderRegionOrder, genderTotal, rateMonthMap };
}

// 평균과 동일한 도체중량 기준으로 가격 변동성을 계산한다.
function lrWeightedStdev(observations, mean){
  const weightSum = observations.reduce((sum, item) => sum + item.weight, 0);
  if (!weightSum) return 0;
  const variance = observations.reduce((sum, item) =>
    sum + item.weight * Math.pow(item.value - mean, 2), 0) / weightSum;
  return Math.sqrt(variance);
}

// kg당 단가 정상범위. renderP1 계열(생체중 기준 unitPrice)에서 이미 쓰고 있는 2,500~9,000원 기준과
// 동일하다(자릿수 입력 오류로 추정되는 이상치 판정 기준, index.html의 "이상치(2,500~9,000원 범위) 판정" 참고).
// Ⅱ섹션의 적용단가(r[15])에는 이 범위를 크게 벗어나는 값(자릿수 오류로 추정, 수만~수십만원)이 섞여 있어
// 그대로 가중평균하면 결과가 10배 이상 부풀려진다 — 같은 기준으로 걸러내고 제외 건수를 안내문에 표시한다.
const LR_PRICE_SANE_MIN = 2500, LR_PRICE_SANE_MAX = 9000;

// "Ⅱ 거래가격 특성분석" 섹션 전용 집계. 도체중기준 가격(총거래금액÷총도체중량)과 적용단가(도체중량 가중평균)를
// 월별로 비교한다. 도매시장(경매) 가격은 원천 데이터에 없어 전 구간에서 제외한다.
function computeSection2(stats){
  const rows = stats.rows;
  const isSane = p => p >= LR_PRICE_SANE_MIN && p <= LR_PRICE_SANE_MAX;

  const pricedAll = rows.filter(r => r.carcassWeight > 0).map(r => ({ ...r, carcassPrice: r.totalAmount / r.carcassWeight }));
  const priced = pricedAll.filter(r => isSane(r.carcassPrice));
  const carcassExcluded = pricedAll.length - priced.length;
  const totalAmountAll = priced.reduce((s, r) => s + r.totalAmount, 0);
  const totalCarcassAll = priced.reduce((s, r) => s + r.carcassWeight, 0);
  const overallCarcassAvg = totalCarcassAll > 0 ? totalAmountAll / totalCarcassAll : 0;

  const appliedRowsAll = rows.filter(r => r.appliedUnitPrice !== null && r.carcassWeight > 0);
  const appliedRows = appliedRowsAll.filter(r => isSane(r.appliedUnitPrice));
  const appliedExcluded = appliedRowsAll.length - appliedRows.length;
  const appliedWeightSum = appliedRows.reduce((s, r) => s + r.carcassWeight, 0);
  const overallAppliedAvg = appliedWeightSum > 0
    ? appliedRows.reduce((s, r) => s + r.appliedUnitPrice * r.carcassWeight, 0) / appliedWeightSum
    : 0;

  const carcassPricesAll = priced.map(r => ({ value: r.carcassPrice, weight: r.carcassWeight }));
  const appliedPricesAll = appliedRows.map(r => ({ value: r.appliedUnitPrice, weight: r.carcassWeight }));
  const overallCarcassStd = lrWeightedStdev(carcassPricesAll, overallCarcassAvg);
  const overallAppliedStd = lrWeightedStdev(appliedPricesAll, overallAppliedAvg);
  const overallCarcassCV = overallCarcassAvg > 0 ? overallCarcassStd / overallCarcassAvg * 100 : 0;
  const overallAppliedCV = overallAppliedAvg > 0 ? overallAppliedStd / overallAppliedAvg * 100 : 0;

  const monthMap = {};
  priced.forEach(r => {
    if (!monthMap[r.ym]) monthMap[r.ym] = { ym: r.ym, amount: 0, carcass: 0, carcassPrices: [], appliedWeighted: 0, appliedWeight: 0, appliedPrices: [] };
    const g = monthMap[r.ym];
    g.amount += r.totalAmount; g.carcass += r.carcassWeight;
    g.carcassPrices.push({ value: r.carcassPrice, weight: r.carcassWeight });
  });
  appliedRows.forEach(r => {
    if (!monthMap[r.ym]) monthMap[r.ym] = { ym: r.ym, amount: 0, carcass: 0, carcassPrices: [], appliedWeighted: 0, appliedWeight: 0, appliedPrices: [] };
    const g = monthMap[r.ym];
    g.appliedWeighted += r.appliedUnitPrice * r.carcassWeight;
    g.appliedWeight += r.carcassWeight;
    g.appliedPrices.push({ value: r.appliedUnitPrice, weight: r.carcassWeight });
  });
  const priceMonthlyList = Object.keys(monthMap).sort().map(ym => {
    const g = monthMap[ym];
    const carcassAvg = g.carcass > 0 ? g.amount / g.carcass : 0;
    const appliedAvg = g.appliedWeight > 0 ? g.appliedWeighted / g.appliedWeight : 0;
    const carcassStd = lrWeightedStdev(g.carcassPrices, carcassAvg);
    const appliedStd = lrWeightedStdev(g.appliedPrices, appliedAvg);
    return {
      ym, carcassAvg, appliedAvg, carcassStd, appliedStd,
      carcassCV: carcassAvg > 0 ? carcassStd / carcassAvg * 100 : 0,
      appliedCV: appliedAvg > 0 ? appliedStd / appliedAvg * 100 : 0
    };
  });

  // 상관성 분석은 거래건(row) 단위로 도체중기준 가격과 적용단가를 짝지어 계산한다(둘 다 정상범위인 건만).
  const pairs = rows.filter(r => r.carcassWeight > 0 && r.appliedUnitPrice !== null)
    .map(r => ({ a: r.totalAmount / r.carcassWeight, b: r.appliedUnitPrice }))
    .filter(p => isSane(p.a) && isSane(p.b));
  let corr = null;
  if (pairs.length > 1) {
    const n = pairs.length;
    const meanA = pairs.reduce((s, p) => s + p.a, 0) / n;
    const meanB = pairs.reduce((s, p) => s + p.b, 0) / n;
    let num = 0, denA = 0, denB = 0;
    pairs.forEach(p => { num += (p.a - meanA) * (p.b - meanB); denA += (p.a - meanA) ** 2; denB += (p.b - meanB) ** 2; });
    corr = (denA > 0 && denB > 0) ? num / Math.sqrt(denA * denB) : null;
  }

  return { overallCarcassAvg, overallAppliedAvg, overallCarcassStd, overallAppliedStd, overallCarcassCV, overallAppliedCV, priceMonthlyList, corr, pairCount: pairs.length, carcassExcluded, appliedExcluded };
}

// "Ⅲ 업체 규모별 거래 특성분석" 섹션 전용 집계. 업체 규모구간(SIZE_BUCKET_ORDER, Section1과 동일한
// bucketBySize 기준)별로 도체중기준 가격·적용단가·성별 구성을 월별/전체로 비교한다.
// 도매시장(경매) 비교치는 원천 데이터에 없어 제외한다.
function computeSection3(stats){
  const isSane = p => p >= LR_PRICE_SANE_MIN && p <= LR_PRICE_SANE_MAX;
  const bucketOf = r => bucketBySize(stats.companyHeadTotal[r.company] || 0);
  const yms = [...new Set(stats.rows.map(r => r.ym))].sort();

  const carcassAgg = {}, appliedAgg = {}, genderAgg = {};
  const ensure = (map, ym, init) => { if (!map[ym]) map[ym] = init(); return map[ym]; };

  stats.rows.forEach(r => {
    const bucket = bucketOf(r);
    const ym = r.ym;

    if (r.carcassWeight > 0) {
      const price = r.totalAmount / r.carcassWeight;
      if (isSane(price)) {
        const g = ensure(carcassAgg, ym, () => ({ all: { amt: 0, cw: 0 }, buckets: {} }));
        if (!g.buckets[bucket]) g.buckets[bucket] = { amt: 0, cw: 0 };
        g.buckets[bucket].amt += r.totalAmount; g.buckets[bucket].cw += r.carcassWeight;
        g.all.amt += r.totalAmount; g.all.cw += r.carcassWeight;
      }
    }
    if (r.appliedUnitPrice !== null && r.carcassWeight > 0 && isSane(r.appliedUnitPrice)) {
      const g = ensure(appliedAgg, ym, () => ({ all: { w: 0, cw: 0 }, buckets: {} }));
      if (!g.buckets[bucket]) g.buckets[bucket] = { w: 0, cw: 0 };
      g.buckets[bucket].w += r.appliedUnitPrice * r.carcassWeight; g.buckets[bucket].cw += r.carcassWeight;
      g.all.w += r.appliedUnitPrice * r.carcassWeight; g.all.cw += r.carcassWeight;
    }

    const gg = ensure(genderAgg, ym, () => ({ all: { female: 0, castrated: 0, male: 0 }, buckets: {} }));
    if (!gg.buckets[bucket]) gg.buckets[bucket] = { female: 0, castrated: 0, male: 0 };
    gg.buckets[bucket].female += r.femaleHead; gg.buckets[bucket].castrated += r.castratedHead; gg.buckets[bucket].male += r.maleHead;
    gg.all.female += r.femaleHead; gg.all.castrated += r.castratedHead; gg.all.male += r.maleHead;
  });

  const carcassMonthly = yms.map(ym => {
    const g = carcassAgg[ym] || { all: { amt: 0, cw: 0 }, buckets: {} };
    const row = { ym, all: g.all.cw > 0 ? g.all.amt / g.all.cw : null };
    SIZE_BUCKET_ORDER.forEach(b => { const bd = g.buckets[b]; row[b] = bd && bd.cw > 0 ? bd.amt / bd.cw : null; });
    return row;
  });
  const carcassOverall = (() => {
    let allAmt = 0, allCw = 0; const bAmt = {}, bCw = {};
    SIZE_BUCKET_ORDER.forEach(b => { bAmt[b] = 0; bCw[b] = 0; });
    Object.values(carcassAgg).forEach(g => {
      allAmt += g.all.amt; allCw += g.all.cw;
      SIZE_BUCKET_ORDER.forEach(b => { if (g.buckets[b]) { bAmt[b] += g.buckets[b].amt; bCw[b] += g.buckets[b].cw; } });
    });
    const row = { all: allCw > 0 ? allAmt / allCw : null };
    SIZE_BUCKET_ORDER.forEach(b => row[b] = bCw[b] > 0 ? bAmt[b] / bCw[b] : null);
    return row;
  })();

  const appliedMonthly = yms.map(ym => {
    const g = appliedAgg[ym] || { all: { w: 0, cw: 0 }, buckets: {} };
    const row = { ym, all: g.all.cw > 0 ? g.all.w / g.all.cw : null };
    SIZE_BUCKET_ORDER.forEach(b => { const bd = g.buckets[b]; row[b] = bd && bd.cw > 0 ? bd.w / bd.cw : null; });
    return row;
  });
  const appliedOverall = (() => {
    let allW = 0, allCw = 0; const bW = {}, bCw = {};
    SIZE_BUCKET_ORDER.forEach(b => { bW[b] = 0; bCw[b] = 0; });
    Object.values(appliedAgg).forEach(g => {
      allW += g.all.w; allCw += g.all.cw;
      SIZE_BUCKET_ORDER.forEach(b => { if (g.buckets[b]) { bW[b] += g.buckets[b].w; bCw[b] += g.buckets[b].cw; } });
    });
    const row = { all: allCw > 0 ? allW / allCw : null };
    SIZE_BUCKET_ORDER.forEach(b => row[b] = bCw[b] > 0 ? bW[b] / bCw[b] : null);
    return row;
  })();

  const genderPct = g => { const sum = g.female + g.castrated + g.male; return sum > 0 ? { female: g.female / sum * 100, other: (g.castrated + g.male) / sum * 100 } : null; };
  const genderMonthly = yms.map(ym => {
    const g = genderAgg[ym] || { all: { female: 0, castrated: 0, male: 0 }, buckets: {} };
    const row = { ym, all: genderPct(g.all) };
    SIZE_BUCKET_ORDER.forEach(b => { row[b] = g.buckets[b] ? genderPct(g.buckets[b]) : null; });
    return row;
  });
  const genderOverall = (() => {
    const allTot = { female: 0, castrated: 0, male: 0 };
    const bTot = {}; SIZE_BUCKET_ORDER.forEach(b => bTot[b] = { female: 0, castrated: 0, male: 0 });
    Object.values(genderAgg).forEach(g => {
      allTot.female += g.all.female; allTot.castrated += g.all.castrated; allTot.male += g.all.male;
      SIZE_BUCKET_ORDER.forEach(b => { if (g.buckets[b]) { bTot[b].female += g.buckets[b].female; bTot[b].castrated += g.buckets[b].castrated; bTot[b].male += g.buckets[b].male; } });
    });
    const row = { all: genderPct(allTot) };
    SIZE_BUCKET_ORDER.forEach(b => row[b] = genderPct(bTot[b]));
    return row;
  })();

  return { yms, carcassMonthly, carcassOverall, appliedMonthly, appliedOverall, genderMonthly, genderOverall };
}

      <div class="section-title"><div class="num">Ⅱ</div><h2>거래가격 특성분석</h2><span class="desc">가격 동향 · 변동성 · 상관성</span></div>

      <div class="kpi-row">

        <div class="card" style="margin-bottom:14px;">
          ${cardHead('table', '월별 평균가격 비교(원/kg)')}
          <div class="price-table-guide">
            <div><b>표 읽는 방법</b> · 기준가격은 도체중을 기준으로 계산한 가격이며, 적용단가는 업체가 실제 정산에 적용한 가격입니다.</div>
            <div>차액은 <b>적용단가 − 기준가격</b>입니다. 음수이면 적용단가가 기준가격보다 낮고, 양수이면 더 높다는 뜻입니다.</div>
            <div class="summary" id="lr_price_avg_summary"></div>

          <div class="table-scroll"><table id="lr_t_price_avg"></table></div>
        </div>
        <div class="card" style="margin-bottom:14px;">
          ${cardHead('table', '월별 가격 변동성 비교(표준편차, 원/kg)')}
          <div class="price-table-guide">
            <div><b>표 읽는 방법</b> · 표준편차는 한 달 동안 가격이 평균값 주변에서 얼마나 흔들렸는지를 나타냅니다.</div>
            <div><b>숫자가 작을수록 가격이 안정적</b>이고, 숫자가 클수록 거래별 가격 차이가 커 변동성이 높다는 뜻입니다.</div>
            <div>변동성 차이는 <b>적용단가 표준편차 − 기준가격 표준편차</b>이며, 아래의 ‘쉽게 읽기’에서 어느 가격이 더 안정적인지 바로 확인할 수 있습니다.</div>
            <div class="summary" id="lr_price_std_summary"></div>
          </div>
          <div class="table-scroll"><table id="lr_t_price_std"></table></div>
        </div>
        <div class="card">
          ${cardHead('table', '월별 상대 변동성 비교(변동계수, %)')}
          <div class="price-table-guide">
            <div><b>표 읽는 방법</b> · 변동계수는 가격의 흔들림을 평균가격 대비 비율로 나타낸 값입니다. 예를 들어 5%는 거래가격이 평균가격 주변에서 약 5% 수준으로 변동했다는 뜻입니다.</div>
            <div><b>숫자가 작을수록 상대적으로 안정적</b>이고, 서로 가격 수준이 달라도 변동성을 같은 기준으로 비교할 수 있습니다.</div>
            <div>변동계수 차이는 <b>적용단가 변동계수 − 기준가격 변동계수</b>입니다. 양수이면 기준가격이, 음수이면 적용단가가 상대적으로 더 안정적입니다.</div>
            <div class="summary" id="lr_price_cv_summary"></div>

          <div class="corr-scale">
            <span><b>-1에 가까움</b><br>서로 반대로 움직임</span>
            <span><b>0에 가까움</b><br>뚜렷한 관계 없음</span>

          <div class="corr-caution"><b>주의</b> · 상관관계는 두 가격이 함께 움직이는 경향을 뜻할 뿐, 한 가격이 다른 가격의 변화를 직접 일으킨다는 의미는 아닙니다.</div>

    <div class="section" id="lr-s3">
      <div class="section-title"><div class="num">Ⅲ</div><h2>업체 규모별 거래 특성분석</h2></div>

      <div class="subtitle">규모별 거래가격 비교 - 도체중기준 가격</div>
      <div class="card" style="margin-bottom:14px;">
        ${cardHead('trend', '규모별 평균가격 추이(원/kg)')}
        <div class="chart-wrap" style="height:250px;"><canvas id="lr_c_size_price1"></canvas></div>
      </div>

      <div class="subtitle">규모별 거래가격 비교 - 적용단가 기준</div>
      <div class="card" style="margin-bottom:14px;">
        ${cardHead('trend', '규모별 평균가격 추이(원/kg)')}
        <div class="chart-wrap" style="height:250px;"><canvas id="lr_c_size_price2"></canvas></div>
      </div>

      <div class="subtitle">규모별 성별 구성 비교</div>
      <div class="card">
        ${cardHead('table', '업체 규모별 성별 출현율(%)')}
        <div class="price-table-guide">
          <div><b>표 읽는 방법</b> · 각 셀은 해당 월과 업체 규모에서 거래된 돼지 중 <b>암퇘지와 기타 돼지가 차지하는 비율</b>입니다.</div>
          <div><b>기타</b>는 거세돼지와 수퇘지를 합한 값이며, 한 셀의 암퇘지 비율과 기타 비율을 더하면 100%입니다.</div>
          <div>예: <b>암퇘지 51.5% / 기타 48.5%</b>는 거래두수 100마리로 환산하면 암퇘지 약 52마리, 기타 약 48마리라는 뜻입니다.</div>
          <div><b>-</b>는 해당 월·규모 구간에 성별을 비교할 수 있는 거래 데이터가 없다는 뜻입니다.</div>
          <div class="summary" id="lr_size_gender_summary"></div>
        </div>
        <div class="table-scroll"><table id="lr_t_size_gender"></table></div>
      </div>
    </div>

  </div>`;

  // ---- 차트 및 표 렌더링 ----
  // Ⅰ(1~6)은 s1=computeSection1(), Ⅱ(11~13)는 s2=computeSection2(), Ⅲ(14~16)은 s3=computeSection3()의
  // 실데이터로 렌더링한다. Ⅳ는 s1/s2/s3를 조합한 요약이다. 도매시장(경매) 비교치는 원천 데이터에 없어 전 구간 제외.

  // 1. 월별 조사두수·업체수 추이
  const s1Labels = s1.monthlyList.map(m => lrYmLabel(m.ym));
  legacyCharts['lr_c_volume'] = new Chart(document.getElementById('lr_c_volume'), {
    data:{ labels: s1Labels, datasets:[
      {type:'bar', label:'조사두수(두)', data:s1.monthlyList.map(m=>m.head), backgroundColor:CH.blue, borderRadius:4, yAxisID:'y', order:2},
      {type:'line', label:'조사업체 수(개소)', data:s1.monthlyList.map(m=>m.companyCount), borderColor:CH.accent, backgroundColor:CH.accent, tension:.3, yAxisID:'y1', pointRadius:4, borderWidth:2.5, order:1}
    ]},
    options:{responsive:true, maintainAspectRatio:false,
      scales:{ y:{position:'left', title:{display:true,text:'두'}}, y1:{position:'right', grid:{drawOnChartArea:false}, title:{display:true,text:'개소'}} },
      plugins:{legend:{position:'bottom'}} }
  });
  // 2. 업체 규모/지역 분포
  legacyCharts['lr_c_size_dist'] = new Chart(document.getElementById('lr_c_size_dist'), {
    type:'doughnut',
    data:{ labels: SIZE_BUCKET_ORDER, datasets:[{data: SIZE_BUCKET_ORDER.map(b=>s1.sizeCount[b]), backgroundColor:[CH.gray,CH.blue,CH.navy2,CH.navy]}] },
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'right', labels:{boxWidth:11,font:{size:13}}}}}
  });
  legacyCharts['lr_c_region_dist'] = new Chart(document.getElementById('lr_c_region_dist'), {
    type:'doughnut',
    data:{ labels: s1.regionOrder, datasets:[{data: s1.regionOrder.map(rg=>s1.regionCount[rg]), backgroundColor:[CH.navy,CH.blue,CH.accent,CH.green,CH.navy2,CH.red,CH.gray]}] },
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'right', labels:{boxWidth:11,font:{size:13}}}}}
  });

  // 3. 월별 조사데이터 현황
  legacyCharts['lr_c_monthly'] = new Chart(document.getElementById('lr_c_monthly'), {
    data:{ labels: s1Labels, datasets:[
      {type:'bar', label:'평균 도체중량(kg)', data:s1.monthlyList.map(m=>Math.round(m.avgCarcass*10)/10), backgroundColor:CH.blue, borderRadius:4, yAxisID:'y', order:2},
      {type:'line', label:'마리당 가격(원)', data:s1.monthlyList.map(m=>Math.round(m.pricePerHead)), borderColor:CH.accent, backgroundColor:CH.accent, tension:.3, yAxisID:'y1', pointRadius:4, borderWidth:2.5, order:1}
    ]},
    options:{responsive:true, maintainAspectRatio:false,
      scales:{ y:{position:'left', title:{display:true,text:'kg'}}, y1:{position:'right', grid:{drawOnChartArea:false}, title:{display:true,text:'원/두'}} },
      plugins:{legend:{position:'bottom'}} }
  });
  lrBuildTable('lr_t_monthly', ['구분','업체수(개소)','조사두수(두)','생체중량(톤)','도체중량(톤)','총거래금액(백만원)','평균생체중량(kg)','평균도체중량(kg)','마리당가격(원)'],
    s1.monthlyList.map(m => [lrYmLabel(m.ym), m.companyCount, fmt(m.head), fmt1(m.liveTon), fmt1(m.carcassTon), fmt(m.amountMil), fmt1(m.avgLive), fmt1(m.avgCarcass), fmt(m.pricePerHead)]));

  // 4. 적용단가 유형
  legacyCharts['lr_c_pricetype'] = new Chart(document.getElementById('lr_c_pricetype'), {
    type:'bar',
    data:{ labels: s1.priceTypeDist.map(d=>`유형${d.type}`),
      datasets:[{label:'물량비율(%)', data: s1.priceTypeDist.map(d=>Math.round(d.pct*10)/10), backgroundColor:CH.navy2, borderRadius:4}] },
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}} }
  });

  // 5. 권역별 성별출현율
  const lrGenderPct = (g, key) => { const sum = g.female + g.castrated + g.male; return sum > 0 ? g[key] / sum * 100 : 0; };
  const genderLabels = [...s1.genderRegionOrder, '전체'];
  const genderGroups = [...s1.genderRegionOrder.map(rg => s1.regionGenderMap[rg]), s1.genderTotal];
  legacyCharts['lr_c_gender_region'] = new Chart(document.getElementById('lr_c_gender_region'), {
    type:'bar',
    data:{ labels: genderLabels, datasets:[
      {label:'암(%)', data: genderGroups.map(g=>Math.round(lrGenderPct(g,'female')*10)/10), backgroundColor:CH.red, stack:'s'},
      {label:'거세(%)', data: genderGroups.map(g=>Math.round(lrGenderPct(g,'castrated')*10)/10), backgroundColor:CH.navy2, stack:'s'},
      {label:'수(%)', data: genderGroups.map(g=>Math.round(lrGenderPct(g,'male')*10)/10), backgroundColor:CH.accent, stack:'s'}
    ]},
    options:{responsive:true, maintainAspectRatio:false, scales:{x:{stacked:true}, y:{stacked:true, max:100}}, plugins:{legend:{position:'bottom'}} }
  });

  // 6. 지급률 표(월 x 업체규모구간 평균)
  const rateYms = Object.keys(s1.rateMonthMap).sort();
  const rateTotalBucket = {}; SIZE_BUCKET_ORDER.forEach(b => rateTotalBucket[b] = { sum: 0, count: 0 });
  const rateTotalAll = { sum: 0, count: 0 };
  const rateTotalCompanies = new Set();
  const rateRows = rateYms.map(ym => {
    const g = s1.rateMonthMap[ym];
    g.companies.forEach(c => rateTotalCompanies.add(c));
    const row = [lrYmLabel(ym), g.companies.size];
    SIZE_BUCKET_ORDER.forEach(b => {
      const bd = g.bucket[b];
      if (bd) { rateTotalBucket[b].sum += bd.sum; rateTotalBucket[b].count += bd.count; }
      row.push(bd && bd.count ? fmt1(bd.sum / bd.count) : '-');
    });
    rateTotalAll.sum += g.all.sum; rateTotalAll.count += g.all.count;
    row.push(g.all.count ? `<b>${fmt1(g.all.sum / g.all.count)}</b>` : '-');
    return row;
  });
  const rateTotalRow = ['<b>계</b>', rateTotalCompanies.size];
  SIZE_BUCKET_ORDER.forEach(b => rateTotalRow.push(rateTotalBucket[b].count ? `<b>${fmt1(rateTotalBucket[b].sum / rateTotalBucket[b].count)}</b>` : '-'));
  rateTotalRow.push(rateTotalAll.count ? `<b>${fmt1(rateTotalAll.sum / rateTotalAll.count)}</b>` : '-');
  rateRows.push(rateTotalRow);
  lrBuildTable('lr_t_paymentrate', ['구분','업체수(개소)','3만두미만','3~5만두미만','5~10만두미만','10만두이상','전체평균'], rateRows);

  // 11. 거래가격 특성 - 월별 가격비교
  const s2Labels = s2.priceMonthlyList.map(m => lrYmLabel(m.ym));
  legacyCharts['lr_c_price_compare'] = new Chart(document.getElementById('lr_c_price_compare'), {
    type:'line',
    data:{ labels: s2Labels, datasets:[
      {label:'도체중기준(원/kg)', data: s2.priceMonthlyList.map(m=>Math.round(m.carcassAvg)), borderColor:CH.accent, backgroundColor:CH.accent, tension:.3, pointRadius:5, borderWidth:2.5},
      {label:'적용단가(원/kg)', data: s2.priceMonthlyList.map(m=>Math.round(m.appliedAvg)), borderColor:CH.green, backgroundColor:CH.green, tension:.3, pointRadius:5, borderWidth:2.5}
    ]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}} }
  });

  // 12. 평균·표준편차·변동계수를 각각 독립된 표로 표시한다.
  const priceTableBaseHeaders = ['기간', '도체중기준 가격(A)', '정산 적용단가(B)'];
  const describePriceDifference = (difference) => difference === 0
    ? '기준가격과 같음'
    : `적용단가가 기준가격보다 ${fmt(Math.abs(difference))}원/kg ${difference < 0 ? '낮음' : '높음'}`;
  const priceDifferenceRate = (applied, carcass) => carcass
    ? (applied - carcass) / carcass * 100
    : null;
  const avgRows = s2.priceMonthlyList.map((m, i) => {
    const difference = m.appliedAvg - m.carcassAvg;
    const differenceRate = priceDifferenceRate(m.appliedAvg, m.carcassAvg);
    return [
      s2Labels[i], fmt(m.carcassAvg), fmt(m.appliedAvg),
      `${difference > 0 ? '+' : ''}${fmt(difference)}`,
      differenceRate === null ? '-' : `${differenceRate > 0 ? '+' : ''}${fmt1(differenceRate)}%`,
      describePriceDifference(difference)
    ];
  });
  const overallPriceDifference = s2.overallAppliedAvg - s2.overallCarcassAvg;
  const overallPriceDifferenceRate = priceDifferenceRate(s2.overallAppliedAvg, s2.overallCarcassAvg);
  avgRows.push([
    '<b>전체기간</b>', `<b>${fmt(s2.overallCarcassAvg)}</b>`, `<b>${fmt(s2.overallAppliedAvg)}</b>`,
    `<b>${overallPriceDifference > 0 ? '+' : ''}${fmt(overallPriceDifference)}</b>`,
    `<b>${overallPriceDifferenceRate === null ? '-' : `${overallPriceDifferenceRate > 0 ? '+' : ''}${fmt1(overallPriceDifferenceRate)}%`}</b>`,
    `<b>${describePriceDifference(overallPriceDifference)}</b>`
  ]);
  lrBuildTable('lr_t_price_avg', [...priceTableBaseHeaders, '차액(B-A, 원/kg)', '기준가격 대비 차이율', '쉽게 읽기'], avgRows);
  const priceSummaryEl = document.getElementById('lr_price_avg_summary');
  if (priceSummaryEl) {
    priceSummaryEl.textContent = `전체기간 요약 · ${describePriceDifference(overallPriceDifference)} (${overallPriceDifferenceRate === null ? '차이율 산출 불가' : `${fmt1(Math.abs(overallPriceDifferenceRate))}% ${overallPriceDifferenceRate < 0 ? '낮음' : overallPriceDifferenceRate > 0 ? '높음' : '동일'}`})`;
  }

  const describeVolatilityDifference = (carcassStd, appliedStd) => {
    const difference = appliedStd - carcassStd;
    if (difference === 0) return '두 가격의 안정성이 같음';
    const stablePrice = difference > 0 ? '기준가격' : '적용단가';
    return `${stablePrice}이 ${fmt(Math.abs(difference))}원/kg만큼 더 안정적`;
  };
  const stdRows = s2.priceMonthlyList.map((m, i) => {
    const difference = m.appliedStd - m.carcassStd;
    return [
      s2Labels[i], fmt(m.carcassStd), fmt(m.appliedStd),
      `${difference > 0 ? '+' : ''}${fmt(difference)}`,
      difference === 0 ? '동일' : difference > 0 ? '기준가격' : '적용단가',
      describeVolatilityDifference(m.carcassStd, m.appliedStd)
    ];
  });
  const overallStdDifference = s2.overallAppliedStd - s2.overallCarcassStd;
  stdRows.push([
    '<b>전체기간</b>', `<b>${fmt(s2.overallCarcassStd)}</b>`, `<b>${fmt(s2.overallAppliedStd)}</b>`,
    `<b>${overallStdDifference > 0 ? '+' : ''}${fmt(overallStdDifference)}</b>`,
    `<b>${overallStdDifference === 0 ? '동일' : overallStdDifference > 0 ? '기준가격' : '적용단가'}</b>`,
    `<b>${describeVolatilityDifference(s2.overallCarcassStd, s2.overallAppliedStd)}</b>`
  ]);
  lrBuildTable('lr_t_price_std', [...priceTableBaseHeaders, '변동성 차이(B-A, 원/kg)', '더 안정적인 가격', '쉽게 읽기'], stdRows);
  const stdSummaryEl = document.getElementById('lr_price_std_summary');
  if (stdSummaryEl) {
    stdSummaryEl.textContent = `전체기간 요약 · ${describeVolatilityDifference(s2.overallCarcassStd, s2.overallAppliedStd)} (기준가격 ${fmt(s2.overallCarcassStd)}, 적용단가 ${fmt(s2.overallAppliedStd)}원/kg)`;
  }

  const describeCvDifference = (carcassCV, appliedCV) => {
    const difference = appliedCV - carcassCV;
    if (Math.abs(difference) < 0.05) return '두 가격의 상대 안정성이 비슷함';
    const stablePrice = difference > 0 ? '기준가격' : '적용단가';
    return `${stablePrice}이 ${fmt1(Math.abs(difference))}%p만큼 더 안정적`;
  };
  const cvRows = s2.priceMonthlyList.map((m, i) => {
    const difference = m.appliedCV - m.carcassCV;
    return [
      s2Labels[i], `${fmt1(m.carcassCV)}%`, `${fmt1(m.appliedCV)}%`,
      `${difference > 0 ? '+' : ''}${fmt1(difference)}%p`,
      Math.abs(difference) < 0.05 ? '비슷함' : difference > 0 ? '기준가격' : '적용단가',
      describeCvDifference(m.carcassCV, m.appliedCV)
    ];
  });
  const overallCvDifference = s2.overallAppliedCV - s2.overallCarcassCV;
  cvRows.push([
    '<b>전체기간</b>', `<b>${fmt1(s2.overallCarcassCV)}%</b>`, `<b>${fmt1(s2.overallAppliedCV)}%</b>`,
    `<b>${overallCvDifference > 0 ? '+' : ''}${fmt1(overallCvDifference)}%p</b>`,
    `<b>${Math.abs(overallCvDifference) < 0.05 ? '비슷함' : overallCvDifference > 0 ? '기준가격' : '적용단가'}</b>`,
    `<b>${describeCvDifference(s2.overallCarcassCV, s2.overallAppliedCV)}</b>`
  ]);
  lrBuildTable('lr_t_price_cv', ['기간', '기준가격 변동계수', '적용단가 변동계수', '변동성 차이(B-A)', '더 안정적인 가격', '쉽게 읽기'], cvRows);
  const cvSummaryEl = document.getElementById('lr_price_cv_summary');
  if (cvSummaryEl) {
    cvSummaryEl.textContent = `전체기간 요약 · ${describeCvDifference(s2.overallCarcassCV, s2.overallAppliedCV)} (기준가격 ${fmt1(s2.overallCarcassCV)}%, 적용단가 ${fmt1(s2.overallAppliedCV)}%)`;
  }

  // 13. 상관성 분석: 중복 상관행렬 대신 해석 가능한 한 줄 요약으로 표시한다.
  const corrAbs = s2.corr === null ? null : Math.abs(s2.corr);
  const corrStrength = corrAbs === null ? '-'
    : corrAbs >= 0.7 ? '강한 상관'
    : corrAbs >= 0.4 ? '중간 상관'
    : corrAbs >= 0.2 ? '약한 상관'
    : '거의 없음';
  const corrDirection = s2.corr === null ? '' : s2.corr >= 0 ? '양의' : '음의';
  const corrInterpretation = s2.corr === null
    ? '비교 가능한 거래 데이터가 부족합니다.'
    : s2.corr >= 0
      ? '도체중기준 가격이 오를수록 정산 적용단가도 대체로 오르는 경향이 있습니다.'
      : '도체중기준 가격과 정산 적용단가가 반대 방향으로 움직이는 경향이 있습니다.';
  const corrPlainText = s2.corr === null
    ? '분석할 수 있는 데이터가 충분하지 않습니다.'
    : s2.corr >= 0
      ? `거래별로 비교했을 때 기준가격이 높은 거래는 적용단가도 높은 경우가 많았습니다. 다만 매번 같은 비율로 움직이는 것은 아닙니다.`
      : `거래별로 비교했을 때 기준가격이 높은 거래는 적용단가가 낮은 경우가 많았습니다. 다만 매번 반대로 움직이는 것은 아닙니다.`;
  const corrConclusionText = s2.corr === null
    ? '현재 데이터로는 두 가격의 관계를 판단하기 어렵습니다.'
    : corrStrength === '거의 없음'
      ? '결론 · 두 가격 사이에 뚜렷한 움직임의 관계가 거의 없습니다.'
      : `결론 · 두 가격은 ${corrStrength === '강한 상관' ? '대체로 뚜렷하게' : corrStrength === '중간 상관' ? '어느 정도' : '약하게'} ${s2.corr >= 0 ? '같은 방향으로' : '반대 방향으로'} 움직입니다.`;
  const corrConclusionEl = document.getElementById('lr_corr_conclusion');
  if (corrConclusionEl) {
    corrConclusionEl.textContent = corrConclusionText;
  }
  const corrPlainEl = document.getElementById('lr_corr_plain');
  if (corrPlainEl) {
    corrPlainEl.innerHTML = `<b>이 데이터의 의미</b> · ${corrPlainText}`;
  }
  lrBuildTable('lr_t_corr_price', ['무엇을 비교했나요?','분석 결과','쉽게 설명하면','해석할 때 주의할 점'], [[
    '거래별 도체중기준 가격과 정산 적용단가',
    s2.corr !== null ? `상관계수 ${s2.corr.toFixed(3)}<br>${corrStrength}(${corrDirection})<br>비교 ${fmt(s2.pairCount)}건` : '분석 데이터 부족',
    corrPlainText,
    '두 가격이 함께 움직이는 경향을 보여주는 결과이며, 기준가격이 적용단가를 직접 결정한다는 뜻은 아닙니다.'
  ]]);

  // 14. 규모별 거래특성(도체중기준)
  const s3Labels = s3.yms.map(ym => lrYmLabel(ym));
  const s3SizeColors = { '3만두미만': CH.gray, '3~5만두미만': CH.blue, '5~10만두미만': CH.navy2, '10만두이상': CH.navy };
  legacyCharts['lr_c_size_price1'] = new Chart(document.getElementById('lr_c_size_price1'), {
    type:'line',
    data:{ labels: s3Labels, datasets: SIZE_BUCKET_ORDER.map(b => ({
      label: b, data: s3.carcassMonthly.map(r => r[b]), borderColor: s3SizeColors[b], backgroundColor: s3SizeColors[b],
      tension:.3, pointRadius:3, borderWidth:2, spanGaps:true
    })) },
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}} }
  });
  function lrSizeRows(monthly, overall){
    const rows = monthly.map(r => [lrYmLabel(r.ym), r.all !== null ? fmt(r.all) : '-', ...SIZE_BUCKET_ORDER.map(b => r[b] !== null ? fmt(r[b]) : '-')]);
    rows.push(['<b>계</b>', overall.all !== null ? `<b>${fmt(overall.all)}</b>` : '-', ...SIZE_BUCKET_ORDER.map(b => overall[b] !== null ? `<b>${fmt(overall[b])}</b>` : '-')]);
    return rows;
  }
  lrBuildTable('lr_t_size_price1', ['구분','전체평균', ...SIZE_BUCKET_ORDER], lrSizeRows(s3.carcassMonthly, s3.carcassOverall));

  // 15. 규모별 거래특성(적용단가)
  legacyCharts['lr_c_size_price2'] = new Chart(document.getElementById('lr_c_size_price2'), {
    type:'line',
    data:{ labels: s3Labels, datasets: SIZE_BUCKET_ORDER.map(b => ({
      label: b, data: s3.appliedMonthly.map(r => r[b]), borderColor: s3SizeColors[b], backgroundColor: s3SizeColors[b],
      tension:.3, pointRadius:3, borderWidth:2, spanGaps:true
    })) },
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}} }
  });
  lrBuildTable('lr_t_size_price2', ['구분','전체평균', ...SIZE_BUCKET_ORDER], lrSizeRows(s3.appliedMonthly, s3.appliedOverall));

  // 16. 규모별 성별구성 (암/기타(거세+수) 비율, %)
  const lrGenderCell = g => g ? `암퇘지 ${fmt1(g.female)}%<br>기타 ${fmt1(g.other)}%` : '-';
  const lrGenderMeaning = g => {
    if (!g) return '비교 데이터 없음';
    const gap = g.female - g.other;
    if (Math.abs(gap) < 0.1) return '암퇘지와 기타 비중이 같음';
    return `${gap > 0 ? '암퇘지' : '기타'} 비중이 ${fmt1(Math.abs(gap))}%p 더 높음`;
  };
  const s3GenderRows = s3.genderMonthly.map(r => [
    lrYmLabel(r.ym), lrGenderCell(r.all), ...SIZE_BUCKET_ORDER.map(b => lrGenderCell(r[b])), lrGenderMeaning(r.all)
  ]);
  s3GenderRows.push([
    '<b>전체기간</b>', `<b>${lrGenderCell(s3.genderOverall.all)}</b>`,
    ...SIZE_BUCKET_ORDER.map(b => `<b>${lrGenderCell(s3.genderOverall[b])}</b>`),
    `<b>${lrGenderMeaning(s3.genderOverall.all)}</b>`
  ]);
  lrBuildTable('lr_t_size_gender', ['기간','전체 업체','3만두 미만','3~5만두 미만','5~10만두 미만','10만두 이상','월 전체 구성 해석'], s3GenderRows);
  const sizeGenderSummaryEl = document.getElementById('lr_size_gender_summary');
  if (sizeGenderSummaryEl) {
    sizeGenderSummaryEl.textContent = `전체기간 요약 · ${lrGenderMeaning(s3.genderOverall.all)}`;
  }
}

// ================= 네비게이션, 테마 관리 & 초기화 =================
const titles = {p1:'종합현황', p3:'업체별 비교', p4:'권역별 현황', p5:'성별·도체 분석', p6:'지급률 분석', p7:'데이터 품질·이상치', p10:'업체별 등록 현황', p8:'업체 상세 분석', p9:'기존 보고용 통계'};
const renderFns = {p1:renderP1, p3:renderP3, p4:renderP4, p5:renderP5, p6:renderP6, p7:renderP7, p10:renderP10, p8:renderP8, p9:renderP9};
let rendered = {};

// 메뉴마다 서로 다른 URL(해시)이 붙도록 페이지 id <-> 해시 문자열을 매핑한다.
const PAGE_HASH = {p1:'overview', p3:'company', p4:'region', p5:'gender', p6:'rate', p7:'quality', p10:'reg-status', p8:'biz-overview', p9:'legacy-report'};
const HASH_PAGE = Object.fromEntries(Object.entries(PAGE_HASH).map(([pid, h]) => [h, pid]));

// 메뉴 클릭·URL 해시 변경(뒤로/앞으로가기 포함) 양쪽에서 공통으로 쓰는 페이지 전환 함수.
// updateHash=true일 때만(=사용자가 직접 메뉴를 클릭했을 때만) 새 히스토리 항목을 쌓는다.
function activatePage(pid, updateHash){
  if (!titles[pid]) pid = 'p1';
  const previousNavItem = document.querySelector('.nav-item.active');
  const previousPid = previousNavItem ? previousNavItem.dataset.page : '';
  const companySelEl = document.getElementById('filterCompany');
  const enteringBizReport = pid === 'p8' && previousPid !== 'p8';
  const returningToAdmin = pid !== 'p8' && pid !== 'p9' && previousPid === 'p8';

  // 업체 상세 분석은 전체 업체 조회를 제공하지 않고 반드시 한 업체를 선택해야 한다.
  if (companySelEl) {
    const emptyCompanyOption = companySelEl.querySelector('option[value=""]');
    if (emptyCompanyOption) {
      const isBizReport = pid === 'p8';
      emptyCompanyOption.textContent = isBizReport ? '업체를 선택하세요' : '전체 업체';
      emptyCompanyOption.disabled = isBizReport;
    }
  }

  // 업체 통계 보고서는 진입할 때마다 업체 미선택 상태로 시작한다.
  if (enteringBizReport && companySelEl) {
    companySelEl.value = '';
    rendered['p8'] = false;
  }

  // 업체 보고서에서 관리자 메뉴로 돌아오면 전체 업체 기준으로 복원한다.
  if (returningToAdmin && companySelEl) {
    companySelEl.value = '';
    const start = document.getElementById('filterStartDate').value;
    const end = document.getElementById('filterEndDate').value;
    const region = document.getElementById('filterRegion').value;
    if (processDashboardData(start, end, region, '')) rendered = {};
  }

  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === pid));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === pid));
  document.getElementById('pageTitle').textContent = titles[pid];

  // 관리자 업체 상세 분석(p8)에서는 지역 검색을 숨기고 선택한 업체를 분석한다.
  const regionItemEl = document.getElementById('filterRegionItem');
  const filterContainerEl = document.getElementById('filterContainer');
  const companyItemEl = document.getElementById('filterCompanyItem');
  const startDateItemEl = document.getElementById('filterStartDateItem');
  const dateSeparatorEl = document.getElementById('filterDateSeparator');
  const endDateItemEl = document.getElementById('filterEndDateItem');
  const monthStartItemEl = document.getElementById('filterMonthStartItem');
  const monthSeparatorEl = document.getElementById('filterMonthSeparator');
  const monthEndItemEl = document.getElementById('filterMonthEndItem');
  if (pid === 'p8') {
    if (filterContainerEl) filterContainerEl.style.display = '';
    if (regionItemEl) regionItemEl.style.display = 'none';
    if (companyItemEl) companyItemEl.style.display = '';
    if (startDateItemEl) startDateItemEl.style.display = '';
    if (dateSeparatorEl) dateSeparatorEl.style.display = '';
    if (endDateItemEl) endDateItemEl.style.display = '';
    if (monthStartItemEl) monthStartItemEl.style.display = 'none';
    if (monthSeparatorEl) monthSeparatorEl.style.display = 'none';
    if (monthEndItemEl) monthEndItemEl.style.display = 'none';
  } else if (pid === 'p9') {
    // 기존 보고용 통계(p9)는 지역/업체/등록일 필터 대신 조사월(년+월) 범위로만 조회한다.
    if (filterContainerEl) filterContainerEl.style.display = '';
    if (regionItemEl) regionItemEl.style.display = 'none';
    if (companyItemEl) companyItemEl.style.display = 'none';
    if (startDateItemEl) startDateItemEl.style.display = 'none';
    if (dateSeparatorEl) dateSeparatorEl.style.display = 'none';
    if (endDateItemEl) endDateItemEl.style.display = 'none';
    if (monthStartItemEl) monthStartItemEl.style.display = '';
    if (monthSeparatorEl) monthSeparatorEl.style.display = '';
    if (monthEndItemEl) monthEndItemEl.style.display = '';
    populateLegacyMonthFilter();
  } else {
    if (filterContainerEl) filterContainerEl.style.display = '';
    if (regionItemEl) regionItemEl.style.display = '';
    if (companyItemEl) companyItemEl.style.display = '';
    if (startDateItemEl) startDateItemEl.style.display = '';
    if (dateSeparatorEl) dateSeparatorEl.style.display = '';
    if (endDateItemEl) endDateItemEl.style.display = '';
    if (monthStartItemEl) monthStartItemEl.style.display = 'none';
    if (monthSeparatorEl) monthSeparatorEl.style.display = 'none';
    if (monthEndItemEl) monthEndItemEl.style.display = 'none';
  }

  if (returningToAdmin) {
    updateDashboard();
  } else if (!rendered[pid]) {
    renderFns[pid]();
    rendered[pid] = true;
  }
  if (updateHash) {
    const newHash = '#' + (PAGE_HASH[pid] || pid);
    if (location.hash !== newHash) history.pushState(null, '', newHash);
  }
  // 태블릿/스마트폰에서는 메뉴가 화면을 덮는 오버레이이므로, 메뉴 선택 후 자동으로 닫아 콘텐츠를 보여준다.
  if (isMobileViewport()) applySidebarState(true);
}

document.querySelectorAll('.nav-item').forEach(item=>{
  item.addEventListener('click', ()=>{
    activatePage(item.dataset.page, true);
  });
});

// 뒤로/앞으로가기(popstate)나 주소창에서 직접 해시를 바꾼 경우(hashchange) 모두 URL 기준으로 페이지를 맞춘다.
function syncPageFromHash(){
  const pid = HASH_PAGE[location.hash.replace('#', '')] || 'p1';
  activatePage(pid, false);
}
window.addEventListener('popstate', syncPageFromHash);
window.addEventListener('hashchange', syncPageFromHash);

// ================= 좌측 메뉴(사이드바) 열기/닫기 =================
// 1024px 이하(태블릿/스마트폰)에서는 사이드바가 화면을 덮는 오버레이 방식으로 바뀌므로,
// PC의 "밀어내기" 방식과는 별개로 매번 닫힌 채로 시작하고 배경(backdrop) 클릭으로도 닫히게 한다.
function isMobileViewport() {
  return window.matchMedia('(max-width: 1024px)').matches;
}

function applySidebarState(closed) {
  const sidebar = document.querySelector('.sidebar');
  if (sidebar) sidebar.classList.toggle('closed', closed);
  document.body.classList.toggle('sidebar-open', !closed);
}

function initSidebarState() {
  const closed = isMobileViewport() ? true : (localStorage.getItem('sidebar_closed') === 'true');
  applySidebarState(closed);
}

function toggleSidebar() {
  const sidebar = document.querySelector('.sidebar');
  if (!sidebar) return;
  const closed = !sidebar.classList.contains('closed');
  applySidebarState(closed);
  if (!isMobileViewport()) {
    localStorage.setItem('sidebar_closed', closed ? 'true' : 'false');
  }
}

document.getElementById('sidebarToggleBtn').addEventListener('click', toggleSidebar);
document.getElementById('sidebarBackdrop').addEventListener('click', () => applySidebarState(true));
initSidebarState();

// ================= 인쇄 (왼쪽 메뉴 제외, 콘텐츠 영역만) =================
// window.print()는 실제 인쇄 전에 브라우저 자체 인쇄 미리보기 화면을 먼저 띄우므로
// 별도의 커스텀 미리보기 UI 없이도 "미리보기 후 인쇄" 흐름이 보장된다.
document.getElementById('btnPrint').addEventListener('click', () => {
  window.print();
});

// 고정 폭 표에서 말줄임 처리된 셀의 전체 값은 마우스를 올려 확인할 수 있다.
document.addEventListener('mouseover', event => {
  const cell = event.target.closest && event.target.closest('th, td');
  if (cell && !cell.hasAttribute('title')) {
    const fullText = cell.textContent.trim();
    if (fullText) cell.title = fullText;
  }
});

// 파일은 이 브라우저에서만 읽고 분석한다. 정적 사이트에 비밀 토큰을 보관하거나
// GitHub에 직접 쓰는 방식은 안전하지 않으므로 서버 동기화 기능을 제공하지 않는다.
document.getElementById('inputPriceExcel').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  document.getElementById('textPriceExcel').textContent = "1. 가격정보 파싱 중...";

  readExcelFile(file, function(rawRows) {
    excelPriceRows = rawRows;
    document.getElementById('textPriceExcel').textContent = "1. 가격정보 완료 (현재 브라우저에만 반영 🟢)";
    document.getElementById('labelPriceExcel').classList.add('loaded');
    
    if (excelPriceRows && excelCompanyRows) {
      initFilterRange();
      const start = document.getElementById('filterStartDate').value;
      const end = document.getElementById('filterEndDate').value;
      const region = document.getElementById('filterRegion').value;
      const company = document.getElementById('filterCompany').value;
      if (processDashboardData(start, end, region, company)) {
        updateDashboard();
      } else {
        alert('현재 조회 조건(기간/권역/업체)에 해당하는 데이터가 없어 새로 업로드한 파일을 반영하지 못했습니다. 조회 조건을 확인해 주세요.');
      }
    }
  });
});

document.getElementById('inputCompanyExcel').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  document.getElementById('textCompanyExcel').textContent = "2. 업체정보 파싱 중...";

  readExcelFile(file, function(rawRows) {
    excelCompanyRows = sanitizeCompanyRows(rawRows);
    document.getElementById('textCompanyExcel').textContent = "2. 업체정보 완료 (현재 브라우저에만 반영 🟢)";
    document.getElementById('labelCompanyExcel').classList.add('loaded');
    
    if (excelPriceRows && excelCompanyRows) {
      initFilterRange();
      const start = document.getElementById('filterStartDate').value;
      const end = document.getElementById('filterEndDate').value;
      const region = document.getElementById('filterRegion').value;
      const company = document.getElementById('filterCompany').value;
      if (processDashboardData(start, end, region, company)) {
        updateDashboard();
      } else {
        alert('현재 조회 조건(기간/권역/업체)에 해당하는 데이터가 없어 새로 업로드한 파일을 반영하지 못했습니다. 조회 조건을 확인해 주세요.');
      }
    }
  });
});

// 기간/지역 조회 버튼 클릭 바인딩
document.getElementById('btnApplyFilter').addEventListener('click', function() {
  const activeNavItem = document.querySelector('.nav-item.active');
  const activePid = activeNavItem ? activeNavItem.dataset.page : '';

  // 기존 보고용 통계(p9)는 지역/업체/등록일이 아니라 조사월(년+월) 범위로만 조회한다.
  if (activePid === 'p9') {
    const range = getLegacyReportMonthRange();
    if (range.start && range.end && range.start > range.end) {
      alert('시작월은 종료월보다 이전이어야 합니다.');
      return;
    }
    localStorage.setItem('search_legacy_start_ym', range.start);
    localStorage.setItem('search_legacy_end_ym', range.end);
    rendered['p9'] = false;
    renderP9();
    rendered['p9'] = true;
    return;
  }

  const start = document.getElementById('filterStartDate').value;
  const end = document.getElementById('filterEndDate').value;
  const region = document.getElementById('filterRegion').value;
  const company = document.getElementById('filterCompany').value;

  if (!start || !end) {
    alert('조회 시작일과 종료일을 올바르게 선택해 주세요.');
    return;
  }
  if (start > end) {
    alert('시작일은 종료일보다 이전 날짜여야 합니다.');
    return;
  }

  // 검색 상태 로컬 스토리지 보관
  localStorage.setItem('search_start_date', start);
  localStorage.setItem('search_end_date', end);
  localStorage.setItem('search_region', region);

  // 업체 상세 분석(p8)은 별도 집계이므로 관리자용 DATA 재가공과 무관하게
  // 선택된 업체와 기간을 반영해 다시 그린다.
  if (activePid === 'p8') {
    rendered['p8'] = false;
    renderP8();
    rendered['p8'] = true;
    return;
  }

  // 데이터 재가공 및 리렌더링
  // processDashboardData가 false를 반환하면(조회 조건에 해당하는 거래가 0건) 화면은 이전 데이터를 그대로 유지한 채라서,
  // 아무 안내 없이 조용히 넘어가면 "검색이 반영 안 됐다"는 걸 사용자가 알 수 없다. 반드시 알려준다.
  if (processDashboardData(start, end, region, company)) {
    updateDashboard();
  } else {
    alert('선택하신 조회 조건(기간/권역/업체)에 해당하는 데이터가 없습니다. 조건을 다시 확인해 주세요.');
  }
});

// 지역을 바꾸면 업체 목록도 그 지역 소속 업체로 다시 좁혀서 채운다
// (선택 안 한 지역의 업체를 고르면 결과가 항상 0건이 되는 걸 방지)
document.getElementById('filterRegion').addEventListener('change', populateCompanyFilter);

function loadEmbeddedOnly() {
  try {
    const rawPriceEl = document.getElementById('RAW_PRICE_HOLDER');
    const rawCompEl = document.getElementById('RAW_COMPANY_HOLDER');
    if (rawPriceEl && rawCompEl) {
      excelPriceRows = JSON.parse(rawPriceEl.textContent);
      excelCompanyRows = sanitizeCompanyRows(JSON.parse(rawCompEl.textContent));

      const txt1 = document.getElementById('textPriceExcel');
      const lbl1 = document.getElementById('labelPriceExcel');
      if (txt1) txt1.textContent = "1. 가격정보 완료 (🟢)";
      if (lbl1) lbl1.classList.add('loaded');
      const txt2 = document.getElementById('textCompanyExcel');
      const lbl2 = document.getElementById('labelCompanyExcel');
      if (txt2) txt2.textContent = "2. 업체정보 완료 (🟢)";
      if (lbl2) lbl2.classList.add('loaded');

      initFilterRange();
      const start = document.getElementById('filterStartDate').value;
      const end = document.getElementById('filterEndDate').value;
      const region = document.getElementById('filterRegion').value;
      const company = document.getElementById('filterCompany').value;
      processDashboardData(start, end, region, company);
    } else {
      initFilterRange();
    }
  } catch(e) {
    console.error('Failed to load embedded default excel data', e);
    initFilterRange();
  } finally {
    const overlay = document.getElementById('loadingOverlay');
    if (overlay) overlay.classList.add('hidden');
  }
}

setChartDefaults();
// 배포 서버의 원본 Excel을 자동 다운로드하지 않는다. 공개 정적 경로에 놓인 원본에는
// 개인정보·API 키가 포함될 수 있으므로, 공개 필드만 담은 내장 데이터로 시작한다.
loadEmbeddedOnly();
activatePage(HASH_PAGE[location.hash.replace('#', '')] || 'p1', false);
updateTopbarFooter(document.querySelector('.nav-item.active').dataset.page);

</script>
