</script>
<style>
:root {
  /* Brand Colors (Visual Refresh 2.0) */
  --navy: #16466F;         /* 딥 네이비 */
  --navy2: #256E9F;        /* 미드 네이비 */
  --blue-light: #4C9DD8;   /* 포인트 블루 */
  --accent: #D99418;       /* 골드 포인트 오렌지 */
  --red: #D84C4C;          /* 에러/주의 레드 */
  --green: #238A65;        /* 정상/완료 그린 */
  
  /* Background & Surface Colors */
  --bg: #EEF3F7;           /* 전체 배경 */
  --card: #FFFFFF;         /* 콘텐츠 카드 */
  --border: #D9E3EC;       /* 테두리 및 구분선 */
  --text: #1D2B36;         /* 기본 텍스트 */
  --sub: #617284;          /* 보조 텍스트 */
  
  /* Shadows (입체감) */
  --shadow: 0 14px 34px rgba(24, 54, 83, .08);
  --shadow-soft: 0 8px 20px rgba(24, 54, 83, .06);
  
  /* Border Radius */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  overflow-x: hidden;
  font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: background 0.3s, color 0.3s;
}
body { display: flex; }

/* ---------- sidebar ---------- */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 230px;
  height: 100vh;
  flex-shrink: 0;
  background: var(--navy);
  color: #fff;
  display: flex;
  flex-direction: column;
  padding: 22px 0;
  box-shadow: 8px 0 30px rgba(24, 54, 83, 0.06);
  z-index: 10;
  overflow-x: hidden;
  overflow-y: auto;
  transition: background 0.3s, width 0.22s ease;
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .18); border-radius: 3px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar.closed {
  width: 0;
  box-shadow: none;
}

/* ---------- upload section ---------- */
.upload-section {
  padding: 10px 18px 18px;
  border-bottom: 1px solid rgba(255, 255, 255, .15);
  margin-bottom: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.upload-title {
  font-size: 13px;
  font-weight: 700;
  color: #BFD3E8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.nav-section-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 800;
  color: #fff;
  letter-spacing: 0.5px;
  padding: 4px 22px 10px;
}
.nav-section-label .icon {
  width: 18px;
  height: 18px;
  stroke: var(--accent);
  fill: none;
  stroke-width: 2;
  flex-shrink: 0;
}
/* 두 번째 이후의 1Depth 메뉴 그룹은 앞 그룹의 하위 메뉴처럼 보이지 않도록 위쪽에 여백과 구분선을 둔다 */
.nav-group + .nav-section-label {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid rgba(255, 255, 255, .15);
}
.file-upload-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px dashed rgba(255, 255, 255, 0.25);
  border-radius: var(--r-sm);
  color: #D9E4F0;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.file-info-text {
  flex: 1 1 auto;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.file-upload-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: var(--accent);
  color: #fff;
}
.file-upload-btn svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  flex-shrink: 0;
}
.file-upload-btn.loaded {
  border-style: solid;
  background: rgba(46, 139, 87, 0.15);
  border-color: var(--green);
  color: #e4f1e9;
}

.sidebar .logo {
  padding: 0 22px 20px;
  font-size: 16px;
  font-weight: 700;
  border-bottom: 1px solid rgba(255, 255, 255, .15);
  margin-bottom: 10px;
}
.sidebar .logo span {
  display: block;
  font-size: 13px;
  font-weight: 400;
  color: #BFD3E8;
  margin-top: 4px;
}
.nav-group {
  position: relative;
  margin: 0 0 8px;
  padding-left: 18px;
}
.nav-group::before {
  content: '';
  position: absolute;
  left: 31px;
  top: 2px;
  bottom: 10px;
  width: 1px;
  background: rgba(255, 255, 255, .15);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 22px 13px 26px;
  cursor: pointer;
  font-size: 14px;
  color: #D9E4F0;
  border-left: 3px solid transparent;
  transition: transform .16s ease, background .16s ease, color .16s ease;
}
.nav-item:hover {
  background: rgba(255, 255, 255, .08);
  transform: translateX(2px); /* 마이크로 모션 */
}
.nav-item.active {
  background: rgba(255, 255, 255, .12);
  border-left: 3px solid var(--accent);
  color: #fff;
  font-weight: 700;
}

/* ---------- main ---------- */
.main { flex: 1; width: 100%; min-width: 0; padding: 24px 28px; box-sizing: border-box; margin-left: 230px; transition: margin-left 0.22s ease; }
.sidebar.closed ~ .main { margin-left: 0; }
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 14px; }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar h1 { font-size: 19px; color: var(--navy); font-weight: 700; }

/* ---------- sidebar toggle button ---------- */
.sidebar-toggle-btn {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  color: var(--navy);
  cursor: pointer;
  box-shadow: var(--shadow-soft);
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
}
.sidebar-toggle-btn:hover { background: #EDF5FB; border-color: #BCD3E4; }
.sidebar-toggle-btn:active { transform: scale(0.93); }
.sidebar-toggle-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
.filter-container {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 10px 16px;
  box-shadow: var(--shadow-soft);
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.filter-item {
  display: flex;
  align-items: center;
  gap: 8px;
}
.filter-item label {
  font-size: 13px;
  font-weight: 700;
  color: var(--sub);
  white-space: nowrap;
}
.filter-item input.filter-date {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  outline: none;
  width: 108px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.filter-item input.filter-date:focus {
  border-color: var(--navy2);
  box-shadow: 0 0 0 3px rgba(37, 110, 159, 0.15);
}
.filter-select {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  outline: none;
  cursor: pointer;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.filter-select:focus {
  border-color: var(--navy2);
  box-shadow: 0 0 0 3px rgba(37, 110, 159, 0.15);
}
.filter-separator {
  color: var(--sub);
  font-size: 13px;

/* ---------- 사이드바 배경 오버레이 (태블릿/모바일에서 메뉴 열렸을 때) ---------- */
.sidebar-backdrop { display: none; }

/* ---------- 반응형: 태블릿 (1024px 이하) ---------- */
@media (max-width: 1024px) {
  .kpi-row { grid-template-columns: repeat(2, 1fr) !important; }
  .grid2, .grid3 { grid-template-columns: 1fr; }

  /* 사이드바를 밀어내는 방식 대신, 화면 위에 겹쳐지는 오버레이 방식으로 전환 */
  .sidebar, .sidebar.closed {
    width: 250px;
  }
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    z-index: 100;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
  }
  .sidebar:not(.closed) {
    transform: translateX(0);
    box-shadow: 10px 0 34px rgba(0, 0, 0, 0.28);
  }

  .sidebar-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    z-index: 90;
  }
  body.sidebar-open .sidebar-backdrop { display: block; }
  body.sidebar-open { overflow: hidden; }

  .main { width: 100%; padding: 20px 18px; margin-left: 0; }
}

/* ---------- 반응형: 스마트폰 (640px 이하) ---------- */
@media (max-width: 640px) {
  .kpi-row { grid-template-columns: 1fr !important; }
  .main { padding: 16px 12px; }
  .topbar h1 { font-size: 16.5px; }
  .filter-container { width: 100%; }
  .filter-container .filter-item { flex: 1 1 auto; min-width: 0; }
  .filter-container .filter-item input.filter-date,
  .filter-container .filter-item .filter-select { width: 100%; min-width: 0; box-sizing: border-box; }
  .filter-apply-btn, .print-btn { flex: 1 1 auto; justify-content: center; }
  .card { padding: 14px 14px; }
  .ellipsis { max-width: 90px; }
}

/* ---------- 인쇄 (왼쪽 메뉴 제외, 콘텐츠 영역만) ---------- */
@media print {
  * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  /* body가 display:flex인 채로 두면 브라우저가 2페이지 이후 내용을 잘라내는 경우가 있어
     인쇄 시에는 일반 블록 흐름으로 바꿔서 콘텐츠가 여러 장에 걸쳐 정상적으로 이어지게 한다. */
  html, body { height: auto !important; overflow: visible !important; }
  body { display: block !important; }
  .sidebar, .sidebar-toggle-btn, .filter-container, .sidebar-backdrop { display: none !important; }
  .main { display: block !important; padding: 0; width: 100%; margin-left: 0 !important; }
  .table-scroll { max-height: none !important; overflow: visible !important; }
  .card, .kpi { box-shadow: none !important; break-inside: avoid; page-break-inside: avoid; }
}

<script>
let DATA = {};
let FILTER_DATA = { regions: [], companies: [], months: [] };

// ================= Supabase 클라우드 DB 연동 =================
// 서버 없이 GitHub Pages에서 동작하므로, 원본 레코드를 Supabase에서 통째로
// 불러온 뒤 브라우저에서 집계한다 (구 server.js의 SQL 집계 로직을 그대로 이식).
const _pigSupabaseCfg = window.PIG_SUPABASE_CONFIG || {};
const supabaseClient = (window.supabase && _pigSupabaseCfg.url && _pigSupabaseCfg.anonKey)
  ? window.supabase.createClient(_pigSupabaseCfg.url, _pigSupabaseCfg.anonKey)
  : null;

// allCompanies/allPriceRecords는 화면 렌더링용(비밀번호에 따라 업체명이 익명화될 수 있음).
// allCompaniesRaw/allPriceRecordsRaw는 항상 실제 업체명 그대로인 원본이며, 업로드 시
// 권역 매핑처럼 실제 업체명이 꼭 필요한 내부 로직에서만 사용한다.
let allCompanies = [];       // pig_companies 테이블 (화면 표시용, 익명화 가능)
let allPriceRecords = [];    // pig_price_records 테이블 (화면 표시용, 익명화 가능)
let allCompaniesRaw = [];    // pig_companies 테이블 원본 (항상 실제 업체명)
let allPriceRecordsRaw = []; // pig_price_records 테이블 원본 (항상 실제 업체명)

// Supabase(PostgREST)는 select('*')를 기본 1000행으로 잘라서 응답하므로,
// 전체를 다 받을 때까지 range()로 페이지를 나눠 반복 조회한다.
async function fetchAllRows(table) {
  const pageSize = 1000;
  let from = 0;
  let allRows = [];
  while (true) {
    const { data, error } = await supabaseClient.from(table).select('*').range(from, from + pageSize - 1);
    if (error) throw error;
    allRows = allRows.concat(data || []);
    if (!data || data.length < pageSize) break;
    from += pageSize;
  }
  return allRows;
}

// 업체명을 'A식육포장처리업체', 'B식육포장처리업체', ... 순으로 바꿔주는 맵을 만든다.
// 26개를 넘어가면 스프레드시트 열 이름처럼 AA, AB, ... 로 이어진다.
// 실제 업체명(가나다순)을 기준으로 매핑해 새로고침해도 같은 업체는 항상 같은 이름을 받는다.
function indexToAlphaLabel(i) {
  let s = '';
  let n = i + 1;
  while (n > 0) {
    const rem = (n - 1) % 26;
    s = String.fromCharCode(65 + rem) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}
function buildAnonCompanyNameMap(companies) {
  const sortedNames = [...new Set(companies.map(c => c.company_name))].sort((a, b) => a.localeCompare(b, 'ko'));
  const map = {};
  sortedNames.forEach((name, i) => { map[name] = `${indexToAlphaLabel(i)}식육포장처리업체`; });
  return map;
}

// 로그인 비밀번호에 따라 화면에 실제 업체명을 보여줄지, 익명화된 이름을 보여줄지 결정한다.
function applyCompanyAnonymization() {
  if (!ANONYMIZE_COMPANIES) {
    allCompanies = allCompaniesRaw;
    allPriceRecords = allPriceRecordsRaw;
    return;
  }
  const nameMap = buildAnonCompanyNameMap(allCompaniesRaw);
  allCompanies = allCompaniesRaw.map(c => ({ ...c, company_name: nameMap[c.company_name] || c.company_name }));
  allPriceRecords = allPriceRecordsRaw.map(r => ({ ...r, company_name: nameMap[r.company_name] || r.company_name }));
}

async function loadAllDataFromSupabase() {
  if (!supabaseClient) throw new Error('Supabase 설정을 찾을 수 없습니다 (config/supabase.config.js 확인 필요).');
  const [companies, priceRecords] = await Promise.all([
    fetchAllRows('pig_companies'),
    fetchAllRows('pig_price_records')
  ]);
  // 업체정보/가격정보 엑셀에 테스트 계정('돼지거래test')이 섞여 있어도 모든 통계에서
  // 처음부터 제외한다. 업로드 로직에도 동일 필터가 있어 신규 업로드분은 애초에 DB에
  // 안 들어가지만, 과거에 이미 들어간 행이 남아있을 수 있어 조회 시점에도 한 번 더 거른다.
  // 여기서 걸러야 allPriceRecordsRaw 기반의 익명화 매핑(buildAnonCompanyNameMap)도
  // 이 업체를 대상에서 완전히 제외하게 된다.
  allCompaniesRaw = companies.filter(c => !TEST_COMPANIES.includes(c.company_name));
  allPriceRecordsRaw = priceRecords.filter(r => !TEST_COMPANIES.includes(r.company_name));
  applyCompanyAnonymization();
}

// ================= 관리자 대시보드 통계 집계 연산 로직 (구 server.js에서 이식) =================
function compileDashboardData(records, activeCompanies) {
  const allRegisteredCompanies = new Set(activeCompanies.map(c => c.company_name));
  const companyRegionMap = {};
  activeCompanies.forEach(c => {
    companyRegionMap[c.company_name] = regionGroupOf(c.sido_name);
  });

  const validRows = [];
  const rawDataQualityAnomalyList = [];
  let nullRateCount = 0;

  const fieldDefs = [
    { key: '두수(생돈매입)', col: 'head_count' },
    { key: '생체중계(kg)', col: 'live_weight' },
    { key: '총거래금액(원)', col: 'total_amount' },
    { key: '지급률(%)', col: 'payment_rate' },
    { key: '도체두수(계)', col: 'carcass_head' },
    { key: '도체중(계,kg)', col: 'carcass_weight' },
    { key: '암 두수', col: 'female_head' },
    { key: '암 도체중(kg)', col: 'female_weight' },
    { key: '거세 두수', col: 'castrated_head' },
    { key: '거세 도체중(kg)', col: 'castrated_weight' },
    { key: '수 두수', col: 'male_head' },
    { key: '수 도체중(kg)', col: 'male_weight' },
    { key: '적용단가 유형', col: 'price_type' },
    { key: '적용단가(원/kg)', col: 'applied_price' }
  ];
  const companyFieldMissingCounts = {};
  const isBlank = v => v === null || v === undefined || v === '';

  records.forEach(r => {
    const unitPrice = r.live_weight > 0 ? r.total_amount / r.live_weight : 0;

    if (r.payment_rate === null) nullRateCount++;

    const company = r.company_name;
    if (!companyFieldMissingCounts[company]) {
      companyFieldMissingCounts[company] = {};
      fieldDefs.forEach(f => { companyFieldMissingCounts[company][f.key] = 0; });
    }
    fieldDefs.forEach(f => {
      if (isBlank(r[f.col])) {
        companyFieldMissingCounts[company][f.key]++;
      }
    });

    const rowObj = {
      company: r.company_name,
      date: r.date_str,
      regDate: r.reg_date_str,
      headCount: r.head_count,
      liveWeight: r.live_weight,
      totalAmount: r.total_amount,
      paymentRate: r.payment_rate,
      carcassHead: r.carcass_head,
      carcassWeight: r.carcass_weight,
      femaleHead: r.female_head,
      femaleWeight: r.female_weight,
      castratedHead: r.castrated_head,
      castratedWeight: r.castrated_weight,
      maleHead: r.male_head,
      maleWeight: r.male_weight,
      unitPrice,
      region: r.region_group
    };
    validRows.push(rowObj);

    if (unitPrice > 0 && (unitPrice < 2500 || unitPrice > 9000)) {
      rawDataQualityAnomalyList.push({
        업체: r.company_name,
        조사일자: r.date_str,
        등록일자: r.reg_date_str,
        두수: r.head_count,
        생체중: r.live_weight,
        총거래금액: r.total_amount,
        kg당가격: unitPrice
      });
    }
  });

  let totalAmountSum = 0;
  let totalHeadSum = 0;
  let totalLiveWeightSum = 0;
  let totalCarcassWeightSum = 0;
  let unitPriceWeightedSum = 0;
  let validPaymentRateSum = 0;
  let validPaymentRateCount = 0;

  const uniqueCompanies = new Set();
  const dateList = [];

  let femaleHeadSum = 0;
  let castratedHeadSum = 0;
  let maleHeadSum = 0;
  let femaleWeightSum = 0;
  let castratedWeightSum = 0;
  let maleWeightSum = 0;

  const monthlyGroup = {};
  const weeklyGroup = {};
  const dailyGroup = {};
  const companyGroup = {};
  const regionGroup = {};

  validRows.forEach(r => {
    totalAmountSum += r.totalAmount;
    totalHeadSum += r.headCount;
    totalLiveWeightSum += r.liveWeight;
    totalCarcassWeightSum += r.carcassWeight;
    unitPriceWeightedSum += (r.unitPrice * r.liveWeight);

    if (r.paymentRate !== null) {
      validPaymentRateSum += r.paymentRate;
      validPaymentRateCount++;
    }

    uniqueCompanies.add(r.company);
    dateList.push(new Date(r.date));

    femaleHeadSum += r.femaleHead;
    femaleWeightSum += r.femaleWeight;
    castratedHeadSum += r.castratedHead;
    castratedWeightSum += r.castratedWeight;
    maleHeadSum += r.maleHead;
    maleWeightSum += r.maleWeight;

    const ym = r.date.substring(0, 7);
    if (!monthlyGroup[ym]) {
      monthlyGroup[ym] = { ym, count: 0, head: 0, live: 0, amount: 0, rateSum: 0, rateCount: 0, priceWeighted: 0 };
    }
    monthlyGroup[ym].count++;
    monthlyGroup[ym].head += r.headCount;
    monthlyGroup[ym].live += r.liveWeight;
    monthlyGroup[ym].amount += r.totalAmount;
    monthlyGroup[ym].priceWeighted += (r.unitPrice * r.liveWeight);
    if (r.paymentRate !== null) {
      monthlyGroup[ym].rateSum += r.paymentRate;
      monthlyGroup[ym].rateCount++;
    }

    const sunStr = getSundayDateString(r.date);
    if (!weeklyGroup[sunStr]) {
      weeklyGroup[sunStr] = { week: sunStr, count: 0, head: 0, amount: 0, live: 0, carcass: 0, rateSum: 0, rateCount: 0 };
    }
    weeklyGroup[sunStr].count++;
    weeklyGroup[sunStr].head += r.headCount;
    weeklyGroup[sunStr].amount += r.totalAmount;
    weeklyGroup[sunStr].live += r.liveWeight;
    weeklyGroup[sunStr].carcass += r.carcassWeight;
    if (r.paymentRate !== null) {
      weeklyGroup[sunStr].rateSum += r.paymentRate;
      weeklyGroup[sunStr].rateCount++;
    }

    if (!dailyGroup[r.date]) {
      dailyGroup[r.date] = { day: r.date, count: 0, head: 0, amount: 0, live: 0, carcass: 0, rateSum: 0, rateCount: 0 };
    }
    dailyGroup[r.date].count++;
    dailyGroup[r.date].head += r.headCount;
    dailyGroup[r.date].amount += r.totalAmount;
    dailyGroup[r.date].live += r.liveWeight;
    dailyGroup[r.date].carcass += r.carcassWeight;
    if (r.paymentRate !== null) {
      dailyGroup[r.date].rateSum += r.paymentRate;
      dailyGroup[r.date].rateCount++;
    }

    if (!companyGroup[r.company]) {
      companyGroup[r.company] = {
        name: r.company, count: 0, head: 0, live: 0, amount: 0,
        rateSum: 0, rateCount: 0, prices: [], region: r.region, lastRegDate: r.regDate, dateSet: new Set()
      };
    }
    companyGroup[r.company].count++;
    companyGroup[r.company].head += r.headCount;
    companyGroup[r.company].live += r.liveWeight;
    companyGroup[r.company].amount += r.totalAmount;
    companyGroup[r.company].prices.push(r.unitPrice);
    companyGroup[r.company].dateSet.add(r.date);
    if (r.regDate > companyGroup[r.company].lastRegDate) {
      companyGroup[r.company].lastRegDate = r.regDate;
    }
    if (r.paymentRate !== null) {
      companyGroup[r.company].rateSum += r.paymentRate;
      companyGroup[r.company].rateCount++;
    }

    if (!regionGroup[r.region]) {
      regionGroup[r.region] = { name: r.region, count: 0, head: 0, live: 0, amount: 0, comps: new Set(), priceWeighted: 0 };
    }
    regionGroup[r.region].count++;
    regionGroup[r.region].head += r.headCount;
    regionGroup[r.region].live += r.liveWeight;
    regionGroup[r.region].amount += r.totalAmount;
    regionGroup[r.region].comps.add(r.company);
    regionGroup[r.region].priceWeighted += (r.unitPrice * r.liveWeight);
  });

  dateList.sort((a,b)=>a-b);
  const formatDate = d => {
    const y = d.getFullYear();
    let m = d.getMonth() + 1;
    let dd = d.getDate();
    return `${y}-${m < 10 ? '0'+m : m}-${dd < 10 ? '0'+dd : dd}`;
  };
  const startDateStr = dateList.length > 0 ? formatDate(dateList[0]) : '';
  const endDateStr = dateList.length > 0 ? formatDate(dateList[dateList.length - 1]) : '';

  const avgPaymentRateGlobal = validPaymentRateCount > 0 ? parseFloat((validPaymentRateSum / validPaymentRateCount).toFixed(2)) : 0;
  const avgCarcassRateGlobal = totalLiveWeightSum > 0 ? parseFloat((totalCarcassWeightSum / totalLiveWeightSum * 100).toFixed(2)) : 0;

  const monthlyList = Object.values(monthlyGroup).map(g => ({
    "연월": g.ym,
    "거래건수": g.count,
    "총두수": g.head,
    "총생체중": g.live,
    "총거래금액": g.amount,
    "평균지급률": g.rateCount > 0 ? g.rateSum / g.rateCount : null,
    "평균kg당가격": g.live > 0 ? Math.round(g.priceWeighted / g.live) : 0
  })).sort((a,b)=>a.연월.localeCompare(b.연월));

  const weeklyList = Object.values(weeklyGroup).map(g => ({
    "주": g.week,
    "거래건수": g.count,
    "총두수": g.head,

  })).sort((a,b)=>a.주.localeCompare(b.주));

  const dailyList = Object.values(dailyGroup).map(g => ({
    "일자": g.day,
    "거래건수": g.count,
    "총두수": g.head,
    "총생체중": g.live,
    "총거래금액": g.amount,
    "평균kg당가격": g.live > 0 ? Math.round(g.amount / g.live) : 0,

  })).sort((a,b)=>a.일자.localeCompare(b.일자));

  const companyList = Object.values(companyGroup).map(g => {
    const meanPrice = g.live > 0 ? g.amount / g.live : 0;
    let variance = 0;
    if (g.prices.length > 1) {
      const avg = g.prices.reduce((sum,p)=>sum+p, 0) / g.prices.length;
      const squaredDiffs = g.prices.map(p => Math.pow(p - avg, 2));
      variance = squaredDiffs.reduce((sum,v)=>sum+v, 0) / (g.prices.length - 1);
    }
    const stdDev = Math.sqrt(variance);

    return {
      "업체": g.name,
      "거래건수": g.count,
      "총두수": g.head,
      "총생체중": g.live,
      "총거래금액": g.amount,

      "거래일수": g.dateSet.size
    };

  const companyFieldQualityList = Object.values(companyGroup)
    .sort((a,b)=>b.count-a.count)
    .map(g => {
      const missingByField = companyFieldMissingCounts[g.name] || {};
      const 항목목록 = fieldDefs.map(f => {

          "항목": f.key,
          "입력건수": filled,
          "총건수": g.count,
          "입력비율": g.count > 0 ? parseFloat((filled / g.count * 100).toFixed(1)) : 0
        };
      });
      return { "업체": g.name, "총건수": g.count, "최근등록일": g.lastRegDate, "항목목록": 항목목록 };
    });

  const regionList = Object.values(regionGroup).map(g => ({
    "권역": g.name,
    "거래건수": g.count,
    "총두수": g.head,
    "총생체중": g.live,
    "총거래금액": g.amount,
    "업체수": g.comps.size,
    "평균kg당가격": g.live > 0 ? Math.round(g.priceWeighted / g.live) : 0
  })).sort((a,b)=>b.총거래금액 - a.총거래금액);

  const monthlyRateList = monthlyList.map(m => ({
    "연월": m.연월,
    "지급률": m.평균지급률 ? parseFloat(m.평균지급률.toFixed(2)) : 0
  }));

  const monthlyYieldList = Object.keys(monthlyGroup).sort().map(ym => {
    const rowsInMonth = validRows.filter(r => r.date.substring(0,7) === ym);
    const liveSum = rowsInMonth.reduce((sum,r)=>sum+r.liveWeight, 0);
    const carcassSum = rowsInMonth.reduce((sum,r)=>sum+r.carcassWeight, 0);
    return {
      "연월": ym,
      "도체율": liveSum > 0 ? parseFloat((carcassSum / liveSum * 100).toFixed(2)) : 0
    };
  });

  const companyRateList = companyList.filter(c => c.평균지급률 !== null).map(c => {
    const rawRowsForComp = validRows.filter(r => r.company === c.업체 && r.paymentRate !== null);
    const compRates = rawRowsForComp.map(r=>r.paymentRate);
    const minRate = compRates.length > 0 ? Math.min(...compRates) : 0;
    const maxRate = compRates.length > 0 ? Math.max(...compRates) : 0;
    return {
      "업체": c.업체,
      "평균": c.평균지급률,
      "min": parseFloat(minRate.toFixed(1)),
      "max": parseFloat(maxRate.toFixed(1)),
      "건수": rawRowsForComp.length
    };
  }).sort((a,b)=>b.평균 - a.평균);

  const rateBins = [
    { label: "65~70%", min: 65, max: 70 },
    { label: "70~72%", min: 70, max: 72 },
    { label: "72~74%", min: 72, max: 74 },
    { label: "74~75%", min: 74, max: 75 },
    { label: "75~76%", min: 75, max: 76 },
    { label: "76~77%", min: 76, max: 77 },
    { label: "77~78%", min: 77, max: 78 },
    { label: "78~79%", min: 78, max: 79 },
    { label: "79~80%", min: 79, max: 80 },
    { label: "80~81%", min: 80, max: 81 }
  ];
  const rateHistogramList = rateBins.map(bin => {
    const count = validRows.filter(r => r.paymentRate !== null && r.paymentRate >= bin.min && r.paymentRate < bin.max).length;
    return {
      "구간": bin.label,
      "건수": count
    };
  });
  rateHistogramList.push({ "구간": "미입력", "건수": nullRateCount });

  const transactedCompanies = new Set(Object.keys(companyGroup));
  const inactiveCompanies = [];
  allRegisteredCompanies.forEach(c => {
    if (!transactedCompanies.has(c)) {
      inactiveCompanies.push(c);
    }
  });

  const companyGroupValues = Object.values(companyGroup);
  const referenceDateStr = companyGroupValues.reduce((max, g) => g.lastRegDate > max ? g.lastRegDate : max, companyGroupValues[0] ? companyGroupValues[0].lastRegDate : startDateStr);
  const referenceDateObj = new Date(referenceDateStr + 'T00:00:00');

  const recentlyInactiveCompanies = companyGroupValues.map(g => {
    const lastDateObj = new Date(g.lastRegDate + 'T00:00:00');
    const diffDays = Math.round((referenceDateObj - lastDateObj) / 86400000);
    return { "업체": g.name, "권역": g.region, "최근등록일": g.lastRegDate, "경과일수": diffDays };
  }).filter(d => d.경과일수 >= 30).sort((a,b)=>b.경과일수 - a.경과일수);

  const companyRegistrationIssues = [
    ...inactiveCompanies.map(c => ({ "업체": c, "권역": companyRegionMap[c] || '-', "상태": "거래가격 미등록", "최근등록일": '-', "경과일수": '-' })),
    ...recentlyInactiveCompanies.map(d => ({ "업체": d.업체, "권역": d.권역, "상태": "최근 1개월 이상 미등록", "최근등록일": d.최근등록일, "경과일수": d.경과일수 }))
  ];

  // ================= (월별) 업체별 등록일-거래일 차이 분석 =================
  // 거래일(date) 기준 월로 묶어서, 등록일(regDate) - 거래일 차이(일)를 업체별로 평균낸다.
  const regGapMonths = Object.keys(monthlyGroup).sort();
  const regGapByCompanyMonth = {};
  validRows.forEach(r => {
    if (!r.date || !r.regDate) return;
    const diffDays = (new Date(r.regDate + 'T00:00:00') - new Date(r.date + 'T00:00:00')) / 86400000;
    if (isNaN(diffDays)) return;
    const ym = r.date.substring(0, 7);
    if (!regGapByCompanyMonth[r.company]) regGapByCompanyMonth[r.company] = {};
    if (!regGapByCompanyMonth[r.company][ym]) regGapByCompanyMonth[r.company][ym] = { sum: 0, count: 0 };
    regGapByCompanyMonth[r.company][ym].sum += diffDays;
    regGapByCompanyMonth[r.company][ym].count++;
  });
  const regGapMonthlyList = Object.values(companyGroup)
    .sort((a,b) => b.count - a.count)
    .map(g => {
      const byMonth = regGapByCompanyMonth[g.name] || {};
      const 월별차이 = regGapMonths.map(ym => {
        const m = byMonth[ym];
        return { "연월": ym, "평균차이일": m ? parseFloat((m.sum / m.count).toFixed(1)) : null };
      });
      return { "업체": g.name, "월별차이": 월별차이 };
    });

  return {
    kpi: {
      "총거래건수": validRows.length,
      "총거래금액_원": totalAmountSum,
      "총두수": totalHeadSum,
      "평균kg당가격": totalLiveWeightSum > 0 ? Math.round(unitPriceWeightedSum / totalLiveWeightSum) : 0,
      "총업체수": uniqueCompanies.size,
      "평균도체율": avgCarcassRateGlobal,
      "평균지급률": avgPaymentRateGlobal,
      "조사시작일": startDateStr,
      "조사종료일": endDateStr
    },
    monthly: monthlyList,
    weekly_price: weeklyList,
    daily: dailyList,
    company: companyList,
    region: regionList,
    reg_gap_months: regGapMonths,
    reg_gap_monthly: regGapMonthlyList,
    gender: {
      "두수": {
        "암": femaleHeadSum,
        "거세": castratedHeadSum,
        "수": maleHeadSum
      },
      "도체중": {
        "암": femaleWeightSum,
        "거세": castratedWeightSum,
        "수": maleWeightSum
      },
      "두당평균도체중": {
        "암": femaleHeadSum > 0 ? parseFloat((femaleWeightSum / femaleHeadSum).toFixed(1)) : 0,
        "거세": castratedHeadSum > 0 ? parseFloat((castratedWeightSum / castratedHeadSum).toFixed(1)) : 0,
        "수": maleHeadSum > 0 ? parseFloat((maleWeightSum / maleHeadSum).toFixed(1)) : 0
      }
    },
    monthly_yield: monthlyYieldList,
    rate_histogram: rateHistogramList,
    monthly_rate: monthlyRateList,
    company_rate: companyRateList,
    data_quality: {
      "이상치건수": rawDataQualityAnomalyList.length,
      "이상치목록": rawDataQualityAnomalyList,
      "지급률결측_전체건수": nullRateCount,
      "지급률결측_비율": parseFloat((nullRateCount / validRows.length * 100).toFixed(1)),
      "업체별항목입력현황": companyFieldQualityList,
      "미참여등록업체": inactiveCompanies,
      "총등록업체수": allRegisteredCompanies.size,
      "기준일": referenceDateStr,
      "최근미등록업체목록": recentlyInactiveCompanies,
      "업체등록현황": companyRegistrationIssues
    }
  };
}

// ================= 엑셀 파일 로드 및 가공 엔진 (업로드용) =================
let excelPriceRows = null;

// 일부 외부 시스템이 내보낸 엑셀은 시트의 <dimension> 메타데이터가 실제 데이터 범위보다
// 작게 남아있는 경우가 있다(예: 실제로는 4,700행인데 A1:R3로 기록됨). 이 값을 그대로 믿으면
// SheetJS가 뒤쪽 데이터를 통째로 못 읽으므로, 실제로 존재하는 셀 좌표를 스캔해 범위를 다시 계산한다.
function fixSheetRange(ws) {
  let minR = Infinity, minC = Infinity, maxR = -1, maxC = -1;
  Object.keys(ws).forEach(key => {
    if (key[0] === '!') return;
    const { r, c } = XLSX.utils.decode_cell(key);
    if (r < minR) minR = r;
    if (c < minC) minC = c;
    if (r > maxR) maxR = r;
    if (c > maxC) maxC = c;
  });
  if (maxR < 0) return;
  const trueRef = XLSX.utils.encode_range({ s: { r: minR, c: minC }, e: { r: maxR, c: maxC } });
  if (trueRef !== ws['!ref']) {
    console.warn(`시트 범위 보정: ${ws['!ref'] || '(없음)'} → ${trueRef}`);
    ws['!ref'] = trueRef;
  }
}

// 파일 리더 유틸
function readExcelFile(file, callback) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, {type: 'array'});
    const sheetName = workbook.SheetNames[0];
    const worksheet = workbook.Sheets[sheetName];
    fixSheetRange(worksheet);
    const rawRows = XLSX.utils.sheet_to_json(worksheet, {header: 1});
    callback(rawRows);
  };
  reader.readAsArrayBuffer(file);
}

// 주간 날짜 계산용 헬퍼 (해당 일요일 날짜 문자열 반환)
function getSundayDateString(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return '기타';
  const day = d.getDay(); // 0: 일요일 ~ 6: 토요일
  const diff = d.getDate() - day;
  const sunday = new Date(d.setDate(diff));
  
  const yyyy = sunday.getFullYear();
  let mm = sunday.getMonth() + 1;
  let dd = sunday.getDate();
  if (mm < 10) mm = '0' + mm;
  if (dd < 10) dd = '0' + dd;
  return `${yyyy}-${mm}-${dd}`;
}

// 등록일자의 전체 최소/최대 날짜 범위를 구하는 헬퍼
// 조회 기간 필터는 등록일자를 기준으로 걸러내지만(processDashboardData 참고), 등록일자는
// 실제 거래(조사)가 일어난 뒤 며칠~몇 달 늦게 입력되는 경우가 많아 등록일자만으로 범위를
// 잡으면 조사일자 기준으로는 더 이른 데이터가 있는데도 검색창 기본값이 그 앞부분을 안 보여주는
// 것처럼 보인다(실제로 걸러지진 않지만 시작일 기본값이 조사기간 시작일보다 늦어 보임).
// 검색기간 기본값이 "데이터가 있는 구간 전체"를 확실히 덮도록 조사일자·등록일자 중 더 이른/늦은
// 값을 range로 잡는다.
function getExcelRegistrationDateRange() {
  if (!excelPriceRows || excelPriceRows.length < 4) return { min: '', max: '' };
  let minDate = '9999-12-31';
  let maxDate = '0000-01-01';

  for (let i = 3; i < excelPriceRows.length; i++) {
    const r = excelPriceRows[i];
    if (!r || r.length < 2) continue;
    const surveyDateStr = r[1];
    let regDateStr = surveyDateStr;
    if (r[16]) {
      const match = String(r[16]).match(/^(\d{4}-\d{2}-\d{2})/);
      if (match) regDateStr = match[1];
    }
    [surveyDateStr, regDateStr].forEach(d => {
      if (!d) return;
      if (d < minDate) minDate = d;
      if (d > maxDate) maxDate = d;
    });
  }
  return { min: minDate, max: maxDate };
}

function populateLegacyMonthFilter() {
  const startYearSel = document.getElementById('filterStartYear');
  const startMonthSel = document.getElementById('filterStartMonth');
  const endYearSel = document.getElementById('filterEndYear');
  const endMonthSel = document.getElementById('filterEndMonth');
  if (!startYearSel) return;

  const sorted = FILTER_DATA.months || [];
  if (sorted.length === 0) return;

  const years = [...new Set(sorted.map(ym => ym.substring(0, 4)))].sort();
  const yearOptionsHtml = years.map(y => `<option value="${y}">${y}년</option>`).join('');
  startYearSel.innerHTML = yearOptionsHtml;
  endYearSel.innerHTML = yearOptionsHtml;

  const dataMinYm = sorted[0], dataMaxYm = sorted[sorted.length - 1];
  const savedStart = localStorage.getItem('search_legacy_start_ym') || '';
  const savedEnd = localStorage.getItem('search_legacy_end_ym') || '';
  const isValidYm = ym => /^\d{4}-\d{2}$/.test(ym) && years.includes(ym.substring(0, 4));
  const startYm = isValidYm(savedStart) ? savedStart : dataMinYm;
  const endYm = isValidYm(savedEnd) ? savedEnd : dataMaxYm;

  startYearSel.value = startYm.substring(0, 4);
  startMonthSel.value = String(parseInt(startYm.substring(5, 7), 10));
  endYearSel.value = endYm.substring(0, 4);
  endMonthSel.value = String(parseInt(endYm.substring(5, 7), 10));
}

  const sm = document.getElementById('filterStartMonth');
  const ey = document.getElementById('filterEndYear');
  const em = document.getElementById('filterEndMonth');
  if (!sy || !sy.value) return { start: '', end: '' };
  return {
    start: `${sy.value}-${String(sm.value).padStart(2, '0')}`,
    end: `${ey.value}-${String(em.value).padStart(2, '0')}`
  };

// UI 캘린더 인풋 초기화 및 상태 관리
function initFilterRange() {
  const startInput = document.getElementById('filterStartDate');
  const endInput = document.getElementById('filterEndDate');
  const regionInput = document.getElementById('filterRegion');
  const companyInput = document.getElementById('filterCompany');
  const monthInputs = ['filterStartYear', 'filterStartMonth', 'filterEndYear', 'filterEndMonth'].map(id => document.getElementById(id));
  const applyBtn = document.getElementById('btnApplyFilter');

  if (startInput) startInput.disabled = false;
  if (endInput) endInput.disabled = false;
  if (regionInput) regionInput.disabled = false;
  if (companyInput) companyInput.disabled = false;
  monthInputs.forEach(el => { if (el) el.disabled = false; });
  if (applyBtn) {
    applyBtn.disabled = false;
    applyBtn.style.opacity = '1';
    applyBtn.style.cursor = 'pointer';
    applyBtn.title = "";
  }

  populateRegionFilter();
  populateCompanyFilter();
  populateLegacyMonthFilter();

  const minDate = (DATA && DATA.kpi && DATA.kpi.조사시작일) || '2025-01-01';
  const maxDate = (DATA && DATA.kpi && DATA.kpi.조사종료일) || new Date().toISOString().substring(0, 10);
  
  if (startInput) {
    startInput.min = minDate;
    startInput.max = maxDate;
    startInput.value = minDate;
  }
  if (endInput) {
    endInput.min = minDate;
    endInput.max = maxDate;
    endInput.value = maxDate;
  }

// 엑셀 통계 집계 연산 (Supabase에서 불러온 원본 레코드를 브라우저에서 집계)
async function fetchDashboardData(startDate, endDate, regionFilter, companyFilter) {
  try {
    const activeCompanies = allCompanies.filter(c => c.use_yn === 'Y');
    const sd = startDate || '1970-01-01';
    const ed = endDate || '2999-12-31';
    let records = allPriceRecords.filter(r => r.date_str >= sd && r.date_str <= ed);
    if (regionFilter) records = records.filter(r => r.region_group === regionFilter);
    if (companyFilter) records = records.filter(r => r.company_name === companyFilter);
    DATA = compileDashboardData(records, activeCompanies);
    return true;
  } catch (e) {
    console.error('Failed to compute dashboard data:', e);
    return false;
  }
}

// ================= P8 업체 상세 분석 집계 (구 server.js에서 이식) =================
// records는 호출부(renderP8)에서 이미 조회기간으로 필터링된 allPriceRecords다.
function computeBizStats(companyName, records) {
  const list = records.filter(r => r.company_name === companyName);
  if (list.length === 0) return null;

  const count = list.length;
  const head = list.reduce((sum, r) => sum + r.head_count, 0);
  const live = list.reduce((sum, r) => sum + r.live_weight, 0);
  const carcass = list.reduce((sum, r) => sum + r.carcass_weight, 0);
  const amount = list.reduce((sum, r) => sum + r.total_amount, 0);
  const rateRows = list.filter(r => r.payment_rate !== null);
  const rateAvg = rateRows.length ? rateRows.reduce((sum, r) => sum + r.payment_rate, 0) / rateRows.length : null;

  const dailyMap = {};
  list.forEach(r => {
    if (!dailyMap[r.date_str]) {
      dailyMap[r.date_str] = { date: r.date_str, count: 0, head: 0, live: 0, carcass: 0, amount: 0, rateSum: 0, rateCount: 0 };
    }
    const d = dailyMap[r.date_str];
    d.count++;
    d.head += r.head_count;
    d.live += r.live_weight;
    d.carcass += r.carcass_weight;
    d.amount += r.total_amount;
    if (r.payment_rate !== null) {
      d.rateSum += r.payment_rate;
      d.rateCount++;
    }
  });
  const daily = Object.values(dailyMap).map(d => ({
    "일자": d.date,
    "거래건수": d.count,
    "총두수": d.head,
    "총생체중": d.live,
    "총거래금액": d.amount,
    "평균kg당가격": d.live > 0 ? Math.round(d.amount / d.live) : 0,
    "도체율": d.live > 0 ? parseFloat((d.carcass / d.live * 100).toFixed(2)) : 0,
    "평균지급률": d.rateCount > 0 ? parseFloat((d.rateSum / d.rateCount).toFixed(2)) : null
  })).sort((a,b) => a.일자.localeCompare(b.일자));

  const weeklyMap = {};
  list.forEach(r => {
    const sunStr = getSundayDateString(r.date_str);
    if (!weeklyMap[sunStr]) {
      weeklyMap[sunStr] = { week: sunStr, count: 0, head: 0, live: 0, carcass: 0, amount: 0, rateSum: 0, rateCount: 0 };
    }
    const w = weeklyMap[sunStr];
    w.count++;
    w.head += r.head_count;
    w.live += r.live_weight;
    w.carcass += r.carcass_weight;
    w.amount += r.total_amount;
    if (r.payment_rate !== null) {
      w.rateSum += r.payment_rate;
      w.rateCount++;
    }
  });
  const weekly = Object.values(weeklyMap).map(w => ({
    "주": w.week,
    "거래건수": w.count,
    "총두수": w.head,
    "총생체중": w.live,
    "총거래금액": w.amount,
    "평균단가": w.live > 0 ? Math.round(w.amount / w.live) : 0,
    "도체율": w.live > 0 ? parseFloat((w.carcass / w.live * 100).toFixed(2)) : 0,
    "평균지급률": w.rateCount > 0 ? parseFloat((w.rateSum / w.rateCount).toFixed(2)) : null
  })).sort((a,b) => a.주.localeCompare(b.주));

  const monthlyMap = {};
  list.forEach(r => {
    const ym = r.date_str.substring(0, 7);
    if (!monthlyMap[ym]) {
      monthlyMap[ym] = { ym, count: 0, head: 0, live: 0, carcass: 0, amount: 0, rateSum: 0, rateCount: 0 };
    }
    const m = monthlyMap[ym];
    m.count++;
    m.head += r.head_count;
    m.live += r.live_weight;
    m.carcass += r.carcass_weight;
    m.amount += r.total_amount;
    if (r.payment_rate !== null) {
      m.rateSum += r.payment_rate;
      m.rateCount++;
    }
  });
  const monthly = Object.values(monthlyMap).map(m => ({
    "연월": m.ym,
    "거래건수": m.count,
    "총두수": m.head,
    "총생체중": m.live,
    "총거래금액": m.amount,
    "평균kg당가격": m.live > 0 ? Math.round(m.amount / m.live) : 0,
    "도체율": m.live > 0 ? parseFloat((m.carcass / m.live * 100).toFixed(2)) : 0,
    "평균지급률": m.rateCount > 0 ? parseFloat((m.rateSum / m.rateCount).toFixed(2)) : null
  })).sort((a,b) => a.연월.localeCompare(b.연월));

  return {
    "업체": companyName,
    "거래건수": count,
    "총두수": head,
    "총생체중": live,
    "총거래금액": amount,
    "평균지급률": rateAvg !== null ? parseFloat(rateAvg.toFixed(2)) : null,
    "평균kg당가격": live > 0 ? Math.round(amount / live) : 0,
    "도체율": live > 0 ? parseFloat((carcass / live * 100).toFixed(2)) : 0,
    "daily": daily,
    "weekly": weekly,
    "monthly": monthly
  };
}

function excelDownloadButtonContent() {
  return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11"/><path d="m8 11 4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><span>엑셀 다운로드</span>`;

function generateTableFromChartInstance(chart) {
  const canvas = chart.canvas;
  if (!canvas || !canvas.id) return;
  const chartId = canvas.id;
  
  if (renderTimer[chartId]) {
    clearTimeout(renderTimer[chartId]);
  }
  
  renderTimer[chartId] = setTimeout(() => {
    delete renderTimer[chartId];
    // 탭 전환·재렌더링 중 파괴된 차트의 지연 콜백은 무시한다.
    if (!canvas.isConnected || chart.canvas !== canvas || chart._destroyed) return;
    const tableId = 'auto_t_' + chartId;
    let autoTableWrap = document.getElementById(tableId + '_wrap');
    if (autoTableWrap) {
      autoTableWrap.remove();
    }
    
    // 차트 축에는 truncLabel로 축약한 라벨을 쓰지만, 자동 생성 표는 스크롤이 되니
    // 축약하지 않은 전체 이름(chart.data.fullLabels가 있으면 그쪽)을 우선 쓴다.
    const labels = chart.data.fullLabels || chart.data.labels || [];
    const datasets = (chart.data.datasets || []).filter((_, index) => !chart.isDatasetVisible || chart.isDatasetVisible(index));
    if (!labels.length || !datasets.length) return;
    const isSizePriceChart = chartId === 'lr_c_size_price1' || chartId === 'lr_c_size_price2';
    
    autoTableWrap = document.createElement('div');
    autoTableWrap.id = tableId + '_wrap';
    autoTableWrap.className = 'auto-table-wrap card';
    autoTableWrap.style.cssText = 'margin-top:16px; padding:16px; border-top:1px solid #eef2f9; background:#ffffff; border-radius:8px; box-shadow:0 2px 12px 0 rgba(0,0,0,0.05);';
    
    const headDiv = document.createElement('div');
    headDiv.className = 'card-head';
    headDiv.style.cssText = 'display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; position:relative; border-bottom:1px solid #f2f5fa; padding-bottom:8px;';
    
    const parentCard = canvas.closest('.card');
    let titleText = '데이터 수치 표';
    if (parentCard) {
      const cardTitleEl = parentCard.querySelector(':scope > h3, :scope > .card-head h3, :scope > .card-head-title');
      if (cardTitleEl) {
        const titleOnlyEl = cardTitleEl.querySelector('.t') || cardTitleEl;
        titleText = titleOnlyEl.textContent.trim() + ' 상세 데이터';
      }
    }
    
    const title = document.createElement('h3');
    title.className = 'card-head-title';
    title.innerText = titleText;
    title.style.cssText = 'font-size:14px; margin:0; font-weight:bold; color:#303133;';
    
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn-excel-download';
    btn.setAttribute('data-target', tableId);
    btn.setAttribute('aria-label', `${titleText} 엑셀 다운로드`);
    btn.innerHTML = excelDownloadButtonContent();
    btn.addEventListener('click', () => {
      downloadTableToExcel(tableId, titleText);
    });
    
    headDiv.appendChild(title);
    headDiv.appendChild(btn);
    autoTableWrap.appendChild(headDiv);

    if (isSizePriceChart) {
      const priceType = chartId === 'lr_c_size_price1' ? '도체중기준 가격' : '정산 적용단가';
      const guide = document.createElement('div');
      guide.className = 'price-table-guide';
      guide.innerHTML = `
        <div><b>표 읽는 방법</b> · 각 행은 조사기간 동안 업체가 거래한 총 두수에 따라 나눈 규모 구간이며, 숫자는 해당 규모 업체들의 월별 <b>${priceType} 평균(원/kg)</b>입니다.</div>
        <div><b>기간평균</b>은 화면에 표시된 월들의 평균적인 가격 수준이며, <b>-</b>는 해당 월·규모 구간에 비교할 데이터가 없다는 뜻입니다.</div>
        <div><b>주의</b> · 규모 구간은 업체의 연간 처리능력이 아니라 현재 등록된 조사기간의 실제 거래두수 합계를 기준으로 구분했습니다.</div>`;
      autoTableWrap.appendChild(guide);
    }
    
    const tableScroll = document.createElement('div');
    tableScroll.className = 'table-scroll';
    
    const table = document.createElement('table');
    table.id = tableId;
    // 일별처럼 항목 수가 많은 표가 카드 폭 안에서 1px 미만으로 압축되지 않도록
    // 모든 열에 동일한 최소 폭을 부여하고 table-scroll에서 가로 스크롤한다.
    const autoTableColumnCount = labels.length + 1 + (isSizePriceChart ? 2 : 0);
    table.style.minWidth = `${Math.max(100, autoTableColumnCount * (isSizePriceChart ? 140 : 96))}px`;
    if (isSizePriceChart) {
      table.classList.add('size-price-detail-table');
    } else {
      // 헤더가 업체명 등 긴 라벨일 때 말줄임(...)으로 잘리지 않도록, 이 표는 열 너비를
      // 내용에 맞춰 자동으로 늘리고(table-layout:auto) 필요하면 가로 스크롤로 본다.
      // size-price-detail-table은 문장형 셀을 줄바꿈하는 별도 규칙을 이미 쓰고 있어 제외한다
      // (두 클래스를 같이 쓰면 동일 우선순위 규칙끼리 CSS 선언 순서로 충돌한다).
      table.classList.add('auto-gen-table');
    }
    
    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    const categoryHead = document.createElement('th');
    categoryHead.textContent = '구분';
    headRow.appendChild(categoryHead);
    labels.forEach(label => {
      const th = document.createElement('th');
      th.textContent = label == null ? '-' : String(label);
      headRow.appendChild(th);
    });
    if (isSizePriceChart) {
      ['기간평균', '쉽게 읽기'].forEach(label => {
        const th = document.createElement('th');
        th.textContent = label;
        headRow.appendChild(th);
      });
    }
    thead.appendChild(headRow);

    const tbody = document.createElement('tbody');
    datasets.forEach(ds => {
      const row = document.createElement('tr');
      const labelCell = document.createElement('td');
      labelCell.className = 'strong';
      labelCell.textContent = ds.label || '수치';
      row.appendChild(labelCell);
      labels.forEach((_, index) => {
        const val = ds.data[index];
        let displayVal = val;
        if (typeof val === 'number') {
          displayVal = Number.isFinite(val) ? (isSizePriceChart ? Math.round(val) : val).toLocaleString('ko-KR') : '-';
        } else if (val == null) {
          displayVal = '-';
        } else if (typeof val === 'object') {
          displayVal = val.y ?? val.x ?? '-';
        }
        const td = document.createElement('td');
        td.textContent = String(displayVal);
        row.appendChild(td);
      });
      if (isSizePriceChart) {
        const validPoints = ds.data
          .map((value, index) => ({ value: typeof value === 'number' && Number.isFinite(value) ? value : null, label: labels[index] }))
          .filter(point => point.value !== null);
        const average = validPoints.length ? validPoints.reduce((sum, point) => sum + point.value, 0) / validPoints.length : null;
        const averageCell = document.createElement('td');
        averageCell.textContent = average === null ? '-' : `${Math.round(average).toLocaleString('ko-KR')}원/kg`;
        row.appendChild(averageCell);

        const summaryCell = document.createElement('td');
        if (!validPoints.length) {
          summaryCell.textContent = '비교 가능한 데이터 없음';
        } else if (validPoints.length === 1) {
          summaryCell.textContent = `${validPoints[0].label} 데이터만 있음`;
        } else {
          const highest = validPoints.reduce((best, point) => point.value > best.value ? point : best);
          const lowest = validPoints.reduce((best, point) => point.value < best.value ? point : best);
          summaryCell.textContent = `가장 높음 ${highest.label} ${Math.round(highest.value).toLocaleString('ko-KR')}원 · 가장 낮음 ${lowest.label} ${Math.round(lowest.value).toLocaleString('ko-KR')}원`;
        }
        row.appendChild(summaryCell);
      }
      tbody.appendChild(row);
    });
    table.appendChild(thead);
    table.appendChild(tbody);
    tableScroll.appendChild(table);
    autoTableWrap.appendChild(tableScroll);
    
    const chartWrap = canvas.closest('.chart-wrap');
    if (!canvas.isConnected) return;
    if (chartWrap) {
      chartWrap.parentNode.insertBefore(autoTableWrap, chartWrap.nextSibling);
    } else {
      canvas.parentNode.insertBefore(autoTableWrap, canvas.nextSibling);
    }
  }, 100);
}

function autoRenderAllChartTables() {
  if (typeof Chart !== 'undefined' && Chart.instances) {
    Object.keys(Chart.instances).forEach(key => {
      const chart = Chart.instances[key];
      if (chart && chart.canvas && chart.canvas.id) {
        generateTableFromChartInstance(chart);
      }
    });
  }
}

// Chart.js 전역 플러그인을 활용한 실시간 이벤트 훅 매핑
if (typeof Chart !== 'undefined') {
  Chart.register({
    id: 'autoTablePlugin',
    afterUpdate: function(chart) {
      if (chart && chart.canvas && chart.canvas.id) {
        generateTableFromChartInstance(chart);
      }
    }
  });
}

// ================= 유틸 & 테마 트래킹 =================
let activeCharts = [];
let legacyCharts = {};

function destroyLegacyCharts() {
  Object.keys(legacyCharts).forEach(key => {
    if (legacyCharts[key]) {
      try { legacyCharts[key].destroy(); } catch(e) {}
    }
  });
  legacyCharts = {};
}

const OriginalChart = Chart;
Chart = function(...args) {
  const instance = new OriginalChart(...args);
  activeCharts.push(instance);
  return instance;
};
Object.setPrototypeOf(Chart, OriginalChart);
Chart.prototype = OriginalChart.prototype;

const fmt = n => n===null||n===undefined||isNaN(n) ? '-' : Math.round(n).toLocaleString('ko-KR');
const fmt1 = n => n===null||n===undefined||isNaN(n) ? '-' : n.toLocaleString('ko-KR', {minimumFractionDigits:1, maximumFractionDigits:1});
const eok = n => (n/100000000).toFixed(1);
// 차트 축 라벨용 업체명 축약 (전체 이름은 툴팁에서 확인 가능)
const truncLabel = (s, n=12) => (s && s.length > n) ? s.slice(0, n) + '...' : s;
// 주간 데이터의 키(해당 주의 일요일 날짜)를 "2월 1주" 형식으로 변환
const formatWeekLabel = (sundayDateStr) => {
  const d = new Date(sundayDateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return sundayDateStr;
  const weekOfMonth = Math.ceil(d.getDate() / 7);
  return `${d.getMonth() + 1}월 ${weekOfMonth}주`;
};

function setChartDefaults() {
  const defaults = (typeof OriginalChart !== 'undefined' && OriginalChart.defaults) || Chart.defaults;

// ================= 종합현황 하단 "추이" 차트들의 월/주/일 공통 전환 =================
// 이 절의 모든 차트(거래금액/가격, 거래건수/두수, 거래금액, 지급률, kg당가격)와 요약 테이블은
// periodToggleHtml()로 뿌려지는 동일한 일/주/월 버튼을 공유하며, 버튼 하나를 누르면 전부 함께 다시 그려진다.
// 일별로 보면 항목 수가 아주 많아질 수 있어(최대 약 200일), 차트 폭 자체는 늘리되
// 카드 영역(.chart-wrap-scroll)의 크기는 고정하고 그 안에서만 가로 스크롤이 생기게 한다.
let overviewGranularity = '월';
const overviewCharts = {}; // canvas id -> Chart 인스턴스

function periodToggleHtml(){
  return `
    <div class="period-toggle">
      <button type="button" class="period-toggle-btn ${overviewGranularity==='월'?'active':''}" onclick="setOverviewGranularity('월')">월</button>
      <button type="button" class="period-toggle-btn ${overviewGranularity==='주'?'active':''}" onclick="setOverviewGranularity('주')">주</button>
      <button type="button" class="period-toggle-btn ${overviewGranularity==='일'?'active':''}" onclick="setOverviewGranularity('일')">일</button>
    </div>
  `;
}

function downloadButtonHtml(fnName){
  fnName = fnName || 'downloadOverviewTable';
  return `<button type="button" class="download-btn" onclick="${fnName}()" title="현재 표를 엑셀 파일로 다운로드">
    ${excelDownloadButtonContent()}
  </button>`;
}

function tableDownloadButtonHtml(tableId, filename){
  return `<button type="button" class="btn-excel-download" data-target="${tableId}" onclick="downloadTableToExcel('${tableId}', '${filename}')" title="현재 표를 엑셀 파일로 다운로드" aria-label="${filename} 엑셀 다운로드">
    ${excelDownloadButtonContent()}
  </button>`;
}

function getOverviewSeries(){
  const gran = overviewGranularity;
  const src = (gran === '일' ? DATA.daily : gran === '주' ? DATA.weekly_price : DATA.monthly) || [];
  const labelKey = gran === '일' ? '일자' : gran === '주' ? '주' : '연월';
  const priceKey = gran === '주' ? '평균단가' : '평균kg당가격';
  return { gran, src, labelKey, priceKey };
}

function overviewLabels(src, labelKey, gran){
  return src.map(d => gran === '주' ? formatWeekLabel(d[labelKey]) : d[labelKey]);
}

function destroyOverviewChart(canvasId){
  const inst = overviewCharts[canvasId];
  if (inst) {
    try { inst.destroy(); } catch(e) {}
    activeCharts = activeCharts.filter(c => c !== inst);
    delete overviewCharts[canvasId];
  }
}

// 항목이 많아지는 일별 등에서 차트가 너무 눌리지 않도록, 카드 폭보다 넓게 필요하면 내부 레이어 폭을 늘려
// 카드 영역(.chart-wrap-scroll)은 고정한 채 그 안에서만 가로 스크롤이 생기게 한다.
function fitScrollWidth(canvasId, innerId, count, gran){
  const canvas = document.getElementById(canvasId);
  const inner = document.getElementById(innerId);
  if (!canvas || !inner) return;
  const wrapWidth = (canvas.parentElement && canvas.parentElement.parentElement && canvas.parentElement.parentElement.clientWidth) || 0;
  const perItemPx = gran === '일' ? 26 : gran === '주' ? 46 : 70;
  inner.style.width = Math.max(wrapWidth, count * perItemPx) + 'px';
}

function setOverviewGranularity(g){
  overviewGranularity = g;
  document.querySelectorAll('#p1 .period-toggle-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent === g);
  });
  renderOverviewTrendChart();
  renderOverviewCountChart();
  renderOverviewAmountChart();
  renderOverviewRateChart();
  renderOverviewPriceChart();
  renderOverviewSummaryTable();
}

function renderOverviewTrendChart(){
  const { gran, src, labelKey, priceKey } = getOverviewSeries();
  destroyOverviewChart('c_overview_month');

  const canvas = document.getElementById('c_overview_month');
  if (!canvas) return;
  fitScrollWidth('c_overview_month', 'overviewTrendInner', src.length, gran);

  // 일별 보기에서는 x축 날짜 라벨을 요일에 맞춰 색칠한다 (토요일 파란색, 일요일 빨간색)
  const xTicks = gran === '일' ? {
    color: (ctx) => {
      const item = src[ctx.index];
      if (!item) return '#6B7A88';
      const dow = new Date(item.일자 + 'T00:00:00').getDay(); // 0: 일요일, 6: 토요일 (T00:00:00을 붙여 UTC가 아닌 로컬 자정 기준으로 파싱)
      if (dow === 0) return CH.red;
      if (dow === 6) return CH.blue;
      return '#6B7A88';
    }
  } : {};

  overviewCharts['c_overview_month'] = new Chart(canvas, {
    data:{ labels: overviewLabels(src, labelKey, gran),
      datasets:[
        {type:'bar', label:'거래금액(억원)', data:src.map(d=>+(d.총거래금액/1e8).toFixed(1)), backgroundColor:CH.navy2, borderRadius:4, yAxisID:'y', maxBarThickness:40, order:2},
        {type:'line', label:'평균 kg당가격(원)', data:src.map(d=>d[priceKey]), borderColor:CH.accent, backgroundColor:CH.accent, tension:.3, yAxisID:'y1', pointRadius:4, order:1, borderWidth:2.5}
      ]},
    options:{responsive:true, maintainAspectRatio:false,
      scales:{ x:{ ticks:xTicks }, y:{position:'left', title:{display:true,text:'억원'}}, y1:{position:'right', grid:{drawOnChartArea:false}, title:{display:true,text:'원/kg'}} },
      plugins:{legend:{position:'bottom'}} }
  });
}

// 권역별 상세 통계에서 참여업체수/거래건수/총두수/거래금액처럼 합산 가능한 값은
// 전체 권역 합계 대비 비중(%)을 함께 계산한다. 평균kg당가격은 평균값이라 비중 개념이
// 성립하지 않으므로 대상에서 제외한다.
function withRegionShare(sorted){
  const totalCompany = sorted.reduce((s,d)=>s+d.업체수,0);
  const totalCount = sorted.reduce((s,d)=>s+d.거래건수,0);
  const totalHead = sorted.reduce((s,d)=>s+d.총두수,0);
  const totalAmount = sorted.reduce((s,d)=>s+d.총거래금액,0);
  const pct = (v, total) => total > 0 ? parseFloat((v / total * 100).toFixed(1)) : 0;
  return sorted.map(d => ({
    ...d,
    업체수비중: pct(d.업체수, totalCompany),
    거래건수비중: pct(d.거래건수, totalCount),
    총두수비중: pct(d.총두수, totalHead),
    거래금액비중: pct(d.총거래금액, totalAmount)
  }));
}

// 선택한 업체 1개에 대해서만 월/주/일 단위로 등록 횟수·거래일 횟수를 다시 집계한다.
// (일 단위 구간에서는 그 구간 안의 조사일자가 하나뿐이라 거래일수가 항상 0 또는 1이 된다)
function computeCompanyRegTrend(companyName, startDate, endDate){
  const sd = startDate || '1970-01-01';
  const ed = endDate || '2999-12-31';
  const rows = allPriceRecords
    .filter(r => r.company_name === companyName && r.date_str >= sd && r.date_str <= ed)
    .map(r => ({ date: r.date_str }))
    .sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);

  const monthlyGroup = {}, weeklyGroup = {}, dailyGroup = {};
  rows.forEach(r => {
    const ym = r.date.substring(0,7);
    if (!monthlyGroup[ym]) monthlyGroup[ym] = { ym, count:0, dateSet:new Set() };
    monthlyGroup[ym].count++; monthlyGroup[ym].dateSet.add(r.date);

    const sunStr = getSundayDateString(r.date);
    if (!weeklyGroup[sunStr]) weeklyGroup[sunStr] = { week:sunStr, count:0, dateSet:new Set() };
    weeklyGroup[sunStr].count++; weeklyGroup[sunStr].dateSet.add(r.date);

    if (!dailyGroup[r.date]) dailyGroup[r.date] = { day:r.date, count:0, dateSet:new Set() };
    dailyGroup[r.date].count++; dailyGroup[r.date].dateSet.add(r.date);
  });

  const monthly = Object.keys(monthlyGroup).sort().map(ym => ({ 연월: ym, 등록횟수: monthlyGroup[ym].count, 거래일수: monthlyGroup[ym].dateSet.size }));
  const weekly = Object.values(weeklyGroup).sort((a,b)=>a.week.localeCompare(b.week)).map(g => ({ 주: g.week, 등록횟수: g.count, 거래일수: g.dateSet.size }));
  const daily = Object.values(dailyGroup).sort((a,b)=>a.day.localeCompare(b.day)).map(g => ({ 일자: g.day, 등록횟수: g.count, 거래일수: g.dateSet.size }));
  const totalDays = new Set(rows.map(r=>r.date)).size;

  return {
    monthly, weekly, daily,
    totalCount: rows.length,
    totalDays,
    firstDate: rows.length ? rows[0].date : '',
    lastDate: rows.length ? rows[rows.length - 1].date : ''
  };
}

function downloadRegistrationTrendTable(){
  if (typeof XLSX === 'undefined') { alert('엑셀 다운로드 기능을 사용할 수 없습니다 (xlsx 라이브러리 로드 실패).'); return; }

  const gran = regStatusGranularity;
  const src = gran === '일' ? p11LastTrend.daily : gran === '주' ? p11LastTrend.weekly : p11LastTrend.monthly;
  const labelKey = gran === '일' ? '일자' : gran === '주' ? '주' : '연월';
  if (!src.length) { alert('다운로드할 데이터가 없습니다.'); return; }
  const rows = src.map(d => ({
    '구분': gran === '주' ? formatWeekLabel(d[labelKey]) : d[labelKey],
    '등록한 횟수': d.등록횟수,

  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, `${companyName}_등록현황`.slice(0, 31));

  XLSX.writeFile(wb, `돼지거래_${companyName}_등록현황_${today}.xlsx`);
}

function downloadTableToExcel(tableId, filename) {
  if (typeof XLSX === 'undefined') { alert('\uc5d1\uc140 \ub2e4\uc6b4\ub85c\ub4dc \uae30\ub2a5\uc744 \uc0ac\uc6a9\ud560 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4 (xlsx \ub77c\uc774\ube0c\ub7ec\ub9ac \ub85c\ub4dc \uc2e4\ud328).'); return; }
  const table = document.getElementById(tableId);
  if (!table) return;

  const aoa = [...table.querySelectorAll('tr')].map(row =>
    [...row.querySelectorAll('td, th')].map(cell =>
      cell.innerText.replace(/(\r\n|\n|\r)/gm, '').replace(/(\s\s+)/gm, ' ')
    )
  );
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, (filename || tableId).slice(0, 31));
  XLSX.writeFile(wb, `${filename || tableId}.xlsx`);
}

function lrBuildTable(elId, headers, rows){
  const el = document.getElementById(elId);
  if (!el) return;
  let h = '<thead><tr>' + headers.map(x=>`<th>${x}</th>`).join('') + '</tr></thead><tbody>';
  rows.forEach(r=>{ h += '<tr>' + r.map((c,i)=>`<td${i===0?' class="strong"':''}>${c}</td>`).join('') + '</tr>'; });
  h += '</tbody>';
  el.innerHTML = h;

  let parent = el.parentElement;
  if (parent && parent.classList.contains('table-scroll')) {
    parent = parent.parentElement;
  }
  if (parent) {
    let existingBtn = parent.querySelector(`.btn-excel-download[data-target="${elId}"]`);
    if (!existingBtn) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-excel-download';
      btn.setAttribute('data-target', elId);
      btn.setAttribute('aria-label', '현재 표를 엑셀 파일로 다운로드');
      btn.innerHTML = excelDownloadButtonContent();
      btn.addEventListener('click', () => {
        const titleEl = parent.querySelector('.card-head-title, h3, .subtitle, .card-head h3');
        const filename = titleEl ? titleEl.innerText.replace('📊', '').replace('📈', '').replace('trend', '').replace('won','').trim() : elId;
        downloadTableToExcel(elId, filename);
      });
      
      const cardHead = parent.querySelector(':scope > h3, :scope > .card-head');
      if (cardHead) {
        cardHead.appendChild(btn);
      } else {
        const actionRow = document.createElement('div');
        actionRow.className = 'table-action-row';
        actionRow.appendChild(btn);
        parent.insertBefore(actionRow, parent.firstChild);
      }
    }
  }
}

// 업체 규모 구간 라벨. 원천 엑셀에는 '연간 처리능력' 같은 규모 정보가 없어
// 조사기간 내 실제 두수 합계를 기준으로 원본 보고서와 동일한 4개 구간 이름을 재사용한다.
// (원본은 '연간 처리능력 추정치' 기준, 이 페이지는 '등록된 기간 내 실측치' 기준 — 화면에 안내 문구로 명시)
const SIZE_BUCKET_ORDER = ['3만두미만','3~5만두미만','5~10만두미만','10만두이상'];
function bucketBySize(totalHead){
  if (totalHead < 30000) return '3만두미만';
  if (totalHead < 50000) return '3~5만두미만';
  if (totalHead < 100000) return '5~10만두미만';
  return '10만두이상';
}

// p9가 쓰는 원천 데이터 1회 파싱·집계. processDashboardData()의 지역/업체/등록일 필터와 달리
// p9는 조사월(년+월) 범위(monthRange = {start, end}, 각각 'YYYY-MM')로만 조회한다 — 지정하지 않으면 전체 기간을 대상으로 한다.
// 도매시장(경매) 관련 통계는 원천에 없어 산출하지 않는다.
function computeLegacyReportStats(monthRange){
  if (!allPriceRecords || allPriceRecords.length === 0) return null;

  // company_name -> 시도명(사용여부 Y, 테스트업체 제외). regionGroupOf()에 넘길 원본 시도명이며
  // 권역(region_group)이 아니다 — computeSection1/3에서 regionGroupOf(row.region)으로 변환해서 쓴다.
  const companyRegionMap = {};
  allCompanies.forEach(c => {
    if (c.company_name && c.use_yn === 'Y' && !TEST_COMPANIES.includes(c.company_name)) {
      companyRegionMap[c.company_name] = c.sido_name || '';
    }
  });

  const rows = [];
  let minDate = null, maxDate = null;
  allPriceRecords.forEach(r => {
    const company = r.company_name;
    const dateStr = r.date_str;
    if (!company || !dateStr || TEST_COMPANIES.includes(company)) return;
    const rowYm = dateStr.substring(0, 7);
    if (monthRange && monthRange.start && (rowYm < monthRange.start || rowYm > monthRange.end)) return;

    const regDate = r.reg_date_str || dateStr;
    if (!minDate || regDate < minDate) minDate = regDate;
    if (!maxDate || regDate > maxDate) maxDate = regDate;

    rows.push({
      company,
      date: dateStr,
      regDate,
      ym: rowYm,
      headCount: r.head_count,
      liveWeight: r.live_weight,
      totalAmount: r.total_amount,
      paymentRate: r.payment_rate,
      carcassHead: r.carcass_head,
      carcassWeight: r.carcass_weight,
      femaleHead: r.female_head,
      castratedHead: r.castrated_head,
      maleHead: r.male_head,
      priceType: r.price_type ? r.price_type : null,
      appliedUnitPrice: r.applied_price > 0 ? r.applied_price : null,
      region: companyRegionMap[company] || '기타'
    });
  });

  if (rows.length === 0) return null;

  const companies = [...new Set(rows.map(r => r.company))];
  const companyHeadTotal = {};
  rows.forEach(r => { companyHeadTotal[r.company] = (companyHeadTotal[r.company] || 0) + r.headCount; });

  return { rows, companyRegionMap, companies, companyHeadTotal, period: { start: minDate, end: maxDate } };
}

// 조사일자('YYYY-MM') -> 'YY.M' 표기 (예: '2026-01' -> '26.1')
function lrYmLabel(ym){
  const [y, m] = ym.split('-');
  return `${y.slice(2)}.${parseInt(m, 10)}`;
}

// "Ⅰ 거래가격 조사 현황" 섹션 전용 집계. computeLegacyReportStats()의 원시 rows를
// 월별/업체규모별/권역별/적용단가유형별/성별로 재가공한다.
function computeSection1(stats){
  const rows = stats.rows;
  const totalHead = rows.reduce((s, r) => s + r.headCount, 0);
  const totalTransactions = rows.length;

  const monthlyMap = {};
  rows.forEach(r => {
    if (!monthlyMap[r.ym]) monthlyMap[r.ym] = { ym: r.ym, companies: new Set(), head: 0, live: 0, carcass: 0, amount: 0 };
    const g = monthlyMap[r.ym];
    g.companies.add(r.company); g.head += r.headCount; g.live += r.liveWeight; g.carcass += r.carcassWeight; g.amount += r.totalAmount;
  });
  const monthlyList = Object.keys(monthlyMap).sort().map(ym => {
    const g = monthlyMap[ym];
    return {
      ym,
      companyCount: g.companies.size,
      head: g.head,
      liveTon: g.live / 1000,
      carcassTon: g.carcass / 1000,
      amountMil: g.amount / 1000000,
      avgLive: g.head > 0 ? g.live / g.head : 0,
      avgCarcass: g.head > 0 ? g.carcass / g.head : 0,
      pricePerHead: g.head > 0 ? g.amount / g.head : 0
    };
  });

  // 업체 규모별 분포 (조사기간 내 실측 두수 합계 기준, 업체 수)
  const sizeCount = {}; SIZE_BUCKET_ORDER.forEach(b => sizeCount[b] = 0);
  stats.companies.forEach(c => { sizeCount[bucketBySize(stats.companyHeadTotal[c] || 0)]++; });

  // 권역별 분포 (업체 수 기준)
  const regionCount = {};
  stats.companies.forEach(c => {
    const rg = regionGroupOf(stats.companyRegionMap[c] || '');
    regionCount[rg] = (regionCount[rg] || 0) + 1;
  });
  const regionOrder = [...REGION_GROUP_ORDER, '기타'].filter(rg => regionCount[rg] > 0);

  // 적용단가 유형별 구성비 (두수 가중)
  const typeHead = {};
  let typeHeadTotal = 0;
  rows.forEach(r => {
    if (r.priceType) { typeHead[r.priceType] = (typeHead[r.priceType] || 0) + r.headCount; typeHeadTotal += r.headCount; }
  });
  const priceTypeDist = Object.entries(typeHead)
    .map(([type, head]) => ({ type, head, pct: typeHeadTotal > 0 ? head / typeHeadTotal * 100 : 0 }))
    .sort((a, b) => b.head - a.head);

  // 권역별 성별 출현율
  const regionGenderMap = {};
  rows.forEach(r => {
    const rg = regionGroupOf(r.region);
    if (!regionGenderMap[rg]) regionGenderMap[rg] = { female: 0, castrated: 0, male: 0 };
    regionGenderMap[rg].female += r.femaleHead;
    regionGenderMap[rg].castrated += r.castratedHead;
    regionGenderMap[rg].male += r.maleHead;
  });
  const genderRegionOrder = regionOrder.filter(rg => regionGenderMap[rg]);
  const genderTotal = { female: 0, castrated: 0, male: 0 };
  genderRegionOrder.forEach(rg => {
    const g = regionGenderMap[rg];
    genderTotal.female += g.female; genderTotal.castrated += g.castrated; genderTotal.male += g.male;
  });

  // 업체 규모별 지급률 (월 x 규모구간 교차표용 원시 집계)
  const rateMonthMap = {};
  rows.forEach(r => {
    if (!rateMonthMap[r.ym]) rateMonthMap[r.ym] = { companies: new Set(), bucket: {}, all: { sum: 0, count: 0 } };
    const g = rateMonthMap[r.ym];
    if (r.paymentRate !== null) {
      const bucket = bucketBySize(stats.companyHeadTotal[r.company] || 0);
      if (!g.bucket[bucket]) g.bucket[bucket] = { sum: 0, count: 0 };
      g.companies.add(r.company);
      g.bucket[bucket].sum += r.paymentRate; g.bucket[bucket].count++;
      g.all.sum += r.paymentRate; g.all.count++;
    }
  });

  return { totalHead, totalTransactions, monthlyList, sizeCount, regionCount, regionOrder, priceTypeDist, regionGenderMap, genderRegionOrder, genderTotal, rateMonthMap };
}

// 평균과 동일한 도체중량 기준으로 가격 변동성을 계산한다.
function lrWeightedStdev(observations, mean){
  const weightSum = observations.reduce((sum, item) => sum + item.weight, 0);
  if (!weightSum) return 0;
  const variance = observations.reduce((sum, item) =>
    sum + item.weight * Math.pow(item.value - mean, 2), 0) / weightSum;
  return Math.sqrt(variance);
}

// kg당 단가 정상범위. renderP1 계열(생체중 기준 unitPrice)에서 이미 쓰고 있는 2,500~9,000원 기준과
// 동일하다(자릿수 입력 오류로 추정되는 이상치 판정 기준, index.html의 "이상치(2,500~9,000원 범위) 판정" 참고).
// Ⅱ섹션의 적용단가(r[15])에는 이 범위를 크게 벗어나는 값(자릿수 오류로 추정, 수만~수십만원)이 섞여 있어
// 그대로 가중평균하면 결과가 10배 이상 부풀려진다 — 같은 기준으로 걸러내고 제외 건수를 안내문에 표시한다.
const LR_PRICE_SANE_MIN = 2500, LR_PRICE_SANE_MAX = 9000;

// "Ⅱ 거래가격 특성분석" 섹션 전용 집계. 도체중기준 가격(총거래금액÷총도체중량)과 적용단가(도체중량 가중평균)를
// 월별로 비교한다. 도매시장(경매) 가격은 원천 데이터에 없어 전 구간에서 제외한다.
function computeSection2(stats){
  const rows = stats.rows;
  const isSane = p => p >= LR_PRICE_SANE_MIN && p <= LR_PRICE_SANE_MAX;

  const pricedAll = rows.filter(r => r.carcassWeight > 0).map(r => ({ ...r, carcassPrice: r.totalAmount / r.carcassWeight }));
  const priced = pricedAll.filter(r => isSane(r.carcassPrice));
  const carcassExcluded = pricedAll.length - priced.length;
  const totalAmountAll = priced.reduce((s, r) => s + r.totalAmount, 0);
  const totalCarcassAll = priced.reduce((s, r) => s + r.carcassWeight, 0);
  const overallCarcassAvg = totalCarcassAll > 0 ? totalAmountAll / totalCarcassAll : 0;

  const appliedRowsAll = rows.filter(r => r.appliedUnitPrice !== null && r.carcassWeight > 0);
  const appliedRows = appliedRowsAll.filter(r => isSane(r.appliedUnitPrice));
  const appliedExcluded = appliedRowsAll.length - appliedRows.length;
  const appliedWeightSum = appliedRows.reduce((s, r) => s + r.carcassWeight, 0);
  const overallAppliedAvg = appliedWeightSum > 0
    ? appliedRows.reduce((s, r) => s + r.appliedUnitPrice * r.carcassWeight, 0) / appliedWeightSum
    : 0;

  const carcassPricesAll = priced.map(r => ({ value: r.carcassPrice, weight: r.carcassWeight }));
  const appliedPricesAll = appliedRows.map(r => ({ value: r.appliedUnitPrice, weight: r.carcassWeight }));
  const overallCarcassStd = lrWeightedStdev(carcassPricesAll, overallCarcassAvg);
  const overallAppliedStd = lrWeightedStdev(appliedPricesAll, overallAppliedAvg);
  const overallCarcassCV = overallCarcassAvg > 0 ? overallCarcassStd / overallCarcassAvg * 100 : 0;
  const overallAppliedCV = overallAppliedAvg > 0 ? overallAppliedStd / overallAppliedAvg * 100 : 0;

  const monthMap = {};
  priced.forEach(r => {
    if (!monthMap[r.ym]) monthMap[r.ym] = { ym: r.ym, amount: 0, carcass: 0, carcassPrices: [], appliedWeighted: 0, appliedWeight: 0, appliedPrices: [] };
    const g = monthMap[r.ym];
    g.amount += r.totalAmount; g.carcass += r.carcassWeight;
    g.carcassPrices.push({ value: r.carcassPrice, weight: r.carcassWeight });
  });
  appliedRows.forEach(r => {
    if (!monthMap[r.ym]) monthMap[r.ym] = { ym: r.ym, amount: 0, carcass: 0, carcassPrices: [], appliedWeighted: 0, appliedWeight: 0, appliedPrices: [] };
    const g = monthMap[r.ym];
    g.appliedWeighted += r.appliedUnitPrice * r.carcassWeight;
    g.appliedWeight += r.carcassWeight;
    g.appliedPrices.push({ value: r.appliedUnitPrice, weight: r.carcassWeight });
  });
  const priceMonthlyList = Object.keys(monthMap).sort().map(ym => {
    const g = monthMap[ym];
    const carcassAvg = g.carcass > 0 ? g.amount / g.carcass : 0;
    const appliedAvg = g.appliedWeight > 0 ? g.appliedWeighted / g.appliedWeight : 0;
    const carcassStd = lrWeightedStdev(g.carcassPrices, carcassAvg);
    const appliedStd = lrWeightedStdev(g.appliedPrices, appliedAvg);
    return {
      ym, carcassAvg, appliedAvg, carcassStd, appliedStd,
      carcassCV: carcassAvg > 0 ? carcassStd / carcassAvg * 100 : 0,
      appliedCV: appliedAvg > 0 ? appliedStd / appliedAvg * 100 : 0
    };
  });

  // 상관성 분석은 거래건(row) 단위로 도체중기준 가격과 적용단가를 짝지어 계산한다(둘 다 정상범위인 건만).
  const pairs = rows.filter(r => r.carcassWeight > 0 && r.appliedUnitPrice !== null)
    .map(r => ({ a: r.totalAmount / r.carcassWeight, b: r.appliedUnitPrice }))
    .filter(p => isSane(p.a) && isSane(p.b));
  let corr = null;
  if (pairs.length > 1) {
    const n = pairs.length;
    const meanA = pairs.reduce((s, p) => s + p.a, 0) / n;
    const meanB = pairs.reduce((s, p) => s + p.b, 0) / n;
    let num = 0, denA = 0, denB = 0;
    pairs.forEach(p => { num += (p.a - meanA) * (p.b - meanB); denA += (p.a - meanA) ** 2; denB += (p.b - meanB) ** 2; });
    corr = (denA > 0 && denB > 0) ? num / Math.sqrt(denA * denB) : null;
  }

  return { overallCarcassAvg, overallAppliedAvg, overallCarcassStd, overallAppliedStd, overallCarcassCV, overallAppliedCV, priceMonthlyList, corr, pairCount: pairs.length, carcassExcluded, appliedExcluded };
}

// "Ⅲ 업체 규모별 거래 특성분석" 섹션 전용 집계. 업체 규모구간(SIZE_BUCKET_ORDER, Section1과 동일한
// bucketBySize 기준)별로 도체중기준 가격·적용단가·성별 구성을 월별/전체로 비교한다.
// 도매시장(경매) 비교치는 원천 데이터에 없어 제외한다.
function computeSection3(stats){
  const isSane = p => p >= LR_PRICE_SANE_MIN && p <= LR_PRICE_SANE_MAX;
  const bucketOf = r => bucketBySize(stats.companyHeadTotal[r.company] || 0);
  const yms = [...new Set(stats.rows.map(r => r.ym))].sort();

  const carcassAgg = {}, appliedAgg = {}, genderAgg = {};
  const ensure = (map, ym, init) => { if (!map[ym]) map[ym] = init(); return map[ym]; };

  stats.rows.forEach(r => {
    const bucket = bucketOf(r);
    const ym = r.ym;

    if (r.carcassWeight > 0) {
      const price = r.totalAmount / r.carcassWeight;
      if (isSane(price)) {
        const g = ensure(carcassAgg, ym, () => ({ all: { amt: 0, cw: 0 }, buckets: {} }));
        if (!g.buckets[bucket]) g.buckets[bucket] = { amt: 0, cw: 0 };
        g.buckets[bucket].amt += r.totalAmount; g.buckets[bucket].cw += r.carcassWeight;
        g.all.amt += r.totalAmount; g.all.cw += r.carcassWeight;
      }
    }
    if (r.appliedUnitPrice !== null && r.carcassWeight > 0 && isSane(r.appliedUnitPrice)) {
      const g = ensure(appliedAgg, ym, () => ({ all: { w: 0, cw: 0 }, buckets: {} }));
      if (!g.buckets[bucket]) g.buckets[bucket] = { w: 0, cw: 0 };
      g.buckets[bucket].w += r.appliedUnitPrice * r.carcassWeight; g.buckets[bucket].cw += r.carcassWeight;
      g.all.w += r.appliedUnitPrice * r.carcassWeight; g.all.cw += r.carcassWeight;
    }

    const gg = ensure(genderAgg, ym, () => ({ all: { female: 0, castrated: 0, male: 0 }, buckets: {} }));
    if (!gg.buckets[bucket]) gg.buckets[bucket] = { female: 0, castrated: 0, male: 0 };
    gg.buckets[bucket].female += r.femaleHead; gg.buckets[bucket].castrated += r.castratedHead; gg.buckets[bucket].male += r.maleHead;
    gg.all.female += r.femaleHead; gg.all.castrated += r.castratedHead; gg.all.male += r.maleHead;
  });

  const carcassMonthly = yms.map(ym => {
    const g = carcassAgg[ym] || { all: { amt: 0, cw: 0 }, buckets: {} };
    const row = { ym, all: g.all.cw > 0 ? g.all.amt / g.all.cw : null };
    SIZE_BUCKET_ORDER.forEach(b => { const bd = g.buckets[b]; row[b] = bd && bd.cw > 0 ? bd.amt / bd.cw : null; });
    return row;
  });
  const carcassOverall = (() => {
    let allAmt = 0, allCw = 0; const bAmt = {}, bCw = {};
    SIZE_BUCKET_ORDER.forEach(b => { bAmt[b] = 0; bCw[b] = 0; });
    Object.values(carcassAgg).forEach(g => {
      allAmt += g.all.amt; allCw += g.all.cw;
      SIZE_BUCKET_ORDER.forEach(b => { if (g.buckets[b]) { bAmt[b] += g.buckets[b].amt; bCw[b] += g.buckets[b].cw; } });
    });
    const row = { all: allCw > 0 ? allAmt / allCw : null };
    SIZE_BUCKET_ORDER.forEach(b => row[b] = bCw[b] > 0 ? bAmt[b] / bCw[b] : null);
    return row;
  })();

  const appliedMonthly = yms.map(ym => {
    const g = appliedAgg[ym] || { all: { w: 0, cw: 0 }, buckets: {} };
    const row = { ym, all: g.all.cw > 0 ? g.all.w / g.all.cw : null };
    SIZE_BUCKET_ORDER.forEach(b => { const bd = g.buckets[b]; row[b] = bd && bd.cw > 0 ? bd.w / bd.cw : null; });
    return row;
  });
  const appliedOverall = (() => {
    let allW = 0, allCw = 0; const bW = {}, bCw = {};
    SIZE_BUCKET_ORDER.forEach(b => { bW[b] = 0; bCw[b] = 0; });
    Object.values(appliedAgg).forEach(g => {
      allW += g.all.w; allCw += g.all.cw;
      SIZE_BUCKET_ORDER.forEach(b => { if (g.buckets[b]) { bW[b] += g.buckets[b].w; bCw[b] += g.buckets[b].cw; } });
    });
    const row = { all: allCw > 0 ? allW / allCw : null };
    SIZE_BUCKET_ORDER.forEach(b => row[b] = bCw[b] > 0 ? bW[b] / bCw[b] : null);
    return row;
  })();

  const genderPct = g => { const sum = g.female + g.castrated + g.male; return sum > 0 ? { female: g.female / sum * 100, other: (g.castrated + g.male) / sum * 100 } : null; };
  const genderMonthly = yms.map(ym => {
    const g = genderAgg[ym] || { all: { female: 0, castrated: 0, male: 0 }, buckets: {} };
    const row = { ym, all: genderPct(g.all) };
    SIZE_BUCKET_ORDER.forEach(b => { row[b] = g.buckets[b] ? genderPct(g.buckets[b]) : null; });
    return row;
  });
  const genderOverall = (() => {
    const allTot = { female: 0, castrated: 0, male: 0 };
    const bTot = {}; SIZE_BUCKET_ORDER.forEach(b => bTot[b] = { female: 0, castrated: 0, male: 0 });
    Object.values(genderAgg).forEach(g => {
      allTot.female += g.all.female; allTot.castrated += g.all.castrated; allTot.male += g.all.male;
      SIZE_BUCKET_ORDER.forEach(b => { if (g.buckets[b]) { bTot[b].female += g.buckets[b].female; bTot[b].castrated += g.buckets[b].castrated; bTot[b].male += g.buckets[b].male; } });
    });
    const row = { all: genderPct(allTot) };
    SIZE_BUCKET_ORDER.forEach(b => row[b] = genderPct(bTot[b]));
    return row;
  })();

  return { yms, carcassMonthly, carcassOverall, appliedMonthly, appliedOverall, genderMonthly, genderOverall };
}
